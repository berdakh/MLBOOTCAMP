# GitHub Pages configuration for the ML Engineering Bootcamp site.
#
# Published from the /docs folder. Two ways to serve it:
#   1. Settings -> Pages -> Source: "Deploy from a branch", branch: main, folder: /docs
#   2. Settings -> Pages -> Source: "GitHub Actions" (uses .github/workflows/pages.yml)
#
# The site holds the handbook, daily plans, guides and capstone briefs. It does
# NOT render the notebooks: pages link to them on GitHub and in Colab.

title: ML Engineering Bootcamp
description: >-
  Five days, about three hours a day, in a free Colab CPU runtime: from
  "I can train a good model" to "I can ship, operate and defend one".
lang: en

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
heading_anchors: true

aux_links:
  "Repository":
    - "https://github.com/berdakh/MLBOOTCAMP"
  "Notebooks on GitHub":
    - "https://github.com/berdakh/MLBOOTCAMP/tree/main/notebooks"
aux_links_new_tab: true

nav_external_links:
  - title: Solutions (on GitHub)
    url: https://github.com/berdakh/MLBOOTCAMP/blob/main/solutions/README.md
  - title: Open notebook 00 in Colab
    url: https://colab.research.google.com/github/berdakh/MLBOOTCAMP/blob/main/notebooks/00_diagnostic.ipynb

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  ML Engineering Bootcamp (MLBOOTCAMP). Code is MIT licensed; prose is CC BY 4.0.
  The TaskFlow dataset is synthetic. Capstone datasets carry their own terms.

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Monitoring and rollback"><title>Monitoring and rollback</title><style>
  .bg{fill:#ffffff} .box{fill:#f4f6fb;stroke:#3b4a6b;stroke-width:1.5}
  .accent{fill:#e3f0ff;stroke:#1f6feb;stroke-width:1.8} .warn{fill:#fff1e6;stroke:#c2410c;stroke-width:1.5}
  .ok{fill:#e8f7ee;stroke:#15803d;stroke-width:1.5} .muted{fill:#f8f8f8;stroke:#9aa3b2;stroke-width:1;stroke-dasharray:4 3}
  .t{font:600 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#1b2333}
  .s{font:12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#4a5568}
  .h{font:700 17px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#1b2333}
  .line{stroke:#3b4a6b;stroke-width:1.6;fill:none} .arrowhead{fill:#3b4a6b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0f1420} .box{fill:#1a2233;stroke:#8da2c9} .accent{fill:#132a4a;stroke:#58a6ff}
    .warn{fill:#3a2414;stroke:#f0883e} .ok{fill:#12301f;stroke:#3fb950} .muted{fill:#161b26;stroke:#5c667a}
    .t,.h{fill:#e6edf3} .s{fill:#a9b4c4} .line{stroke:#8da2c9} .arrowhead{fill:#8da2c9}
  }
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1000" height="320" rx="10"/><text class="h" x="500" y="32" text-anchor="middle">What you can know, and when</text><rect class="ok" x="30" y="60" width="290" height="130" rx="8"/><text class="t" x="175.0" y="104.0" text-anchor="middle">Service health</text><text class="s" x="175.0" y="122.0" text-anchor="middle">available: now</text><text class="s" x="175.0" y="137.0" text-anchor="middle">errors · latency · 5xx</text><text class="s" x="175.0" y="152.0" text-anchor="middle">readiness</text><rect class="accent" x="350" y="60" width="290" height="130" rx="8"/><text class="t" x="495.0" y="104.0" text-anchor="middle">Data &amp; score drift</text><text class="s" x="495.0" y="122.0" text-anchor="middle">available: now</text><text class="s" x="495.0" y="137.0" text-anchor="middle">PSI per feature · unseen</text><text class="s" x="495.0" y="152.0" text-anchor="middle">categories · score mean</text><rect class="warn" x="670" y="60" width="290" height="130" rx="8"/><text class="t" x="815.0" y="104.0" text-anchor="middle">Model performance</text><text class="s" x="815.0" y="122.0" text-anchor="middle">available: 30+ days later</text><text class="s" x="815.0" y="137.0" text-anchor="middle">PR-AUC on matured labels</text><text class="s" x="815.0" y="152.0" text-anchor="middle">precision of flagged</text><rect class="box" x="330" y="230" width="340" height="70" rx="8"/><text class="t" x="500.0" y="251.0" text-anchor="middle">Decision</text><text class="s" x="500.0" y="269.0" text-anchor="middle">page → rollback (pointer move)</text><text class="s" x="500.0" y="284.0" text-anchor="middle">warn → investigate / retrain</text><path class="line" d="M175,192 L380,228" marker-end="url(#ah)"/><path class="line" d="M495,192 L500,228" marker-end="url(#ah)"/><path class="line" d="M815,192 L620,228" marker-end="url(#ah)"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img"><desc>Left: a chain of parent pointers from x up to the root r, four steps long. Right: after path compression every node on that path points directly at the root.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="440" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Union-find: path compression flattens the tree</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">find(x) returns the root of x's set. Compression points every visited node at the root.</text><line x1="200.0" y1="138.0" x2="200.0" y2="114.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="200.0" y1="198.0" x2="200.0" y2="174.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="200.0" y1="258.0" x2="200.0" y2="234.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="200.0" y1="318.0" x2="200.0" y2="294.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><circle cx="200.0" cy="96.0" r="17" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="200.0" y="101.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">r</text><circle cx="200.0" cy="156.0" r="17" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="200.0" y="161.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">3</text><circle cx="200.0" cy="216.0" r="17" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="200.0" y="221.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">2</text><circle cx="200.0" cy="276.0" r="17" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="200.0" y="281.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">1</text><circle cx="200.0" cy="336.0" r="17" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="200.0" y="341.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">x</text><text x="240.0" y="340.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="start">find(x) walks 4 steps</text><text x="240.0" y="100.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="start">root</text><line x1="330.0" y1="216.0" x2="470.0" y2="216.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><text x="400.0" y="209.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">after find(x)</text><line x1="549.8" y1="286.1" x2="649.0" y2="145.5" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="623.9" y1="283.5" x2="655.6" y2="148.5" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="696.1" y1="283.5" x2="664.4" y2="148.5" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="770.2" y1="286.1" x2="671.0" y2="145.5" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><circle cx="660.0" cy="130.0" r="17" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="660.0" y="135.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">r</text><circle cx="540.0" cy="300.0" r="17" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="540.0" y="305.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">x</text><circle cx="620.0" cy="300.0" r="17" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="620.0" y="305.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">1</text><circle cx="700.0" cy="300.0" r="17" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="700.0" y="305.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">2</text><circle cx="780.0" cy="300.0" r="17" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="780.0" y="305.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">3</text><text x="660.0" y="346.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="middle">next find from any of them: 1 step</text><rect x="24.0" y="376.0" width="832.0" height="44.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="440.0" y="403.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Path compression plus union by size: O(α(n)) amortised per operation, effectively constant.</text></svg>

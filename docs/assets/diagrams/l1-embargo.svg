<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img"><desc>Monthly snapshots with 30-day label windows and a train boundary on March 15: the March 1 snapshot's label window crosses the boundary, so the embargo gap drops it from training.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="340" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Why the split has an embargo gap</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Each snapshot's label looks 30 days ahead. Boundary moved to mid-March.</text><rect x="40.0" y="70.0" width="379.0" height="28.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="229.5" y="88.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">train</text><rect x="431.0" y="70.0" width="409.0" height="28.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="635.5" y="88.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">validation</text><path d="M 425 104 L 425 270" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge"/><circle cx="100.0" cy="240.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="100.0" y="262.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Jan 1</text><circle cx="230.0" cy="240.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="230.0" y="262.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Feb 1</text><circle cx="360.0" cy="240.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="360.0" y="262.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Mar 1</text><circle cx="490.0" cy="240.0" r="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="490.0" y="262.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Apr 1</text><circle cx="620.0" cy="240.0" r="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="620.0" y="262.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">May 1</text><circle cx="750.0" cy="240.0" r="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="750.0" y="262.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Jun 1</text><line x1="40.0" y1="240.0" x2="850.0" y2="240.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><rect x="100.0" y="160.0" width="120.0" height="36.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="160.0" y="182.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Jan 1 + 30d</text><path d="M 100 196 L 100 232" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge"/><rect x="230.0" y="160.0" width="120.0" height="36.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="290.0" y="182.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Feb 1 + 30d</text><path d="M 230 196 L 230 232" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge"/><rect x="360.0" y="116.0" width="120.0" height="36.0" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="420.0" y="138.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">crosses: dropped</text><path d="M 360 152 L 360 232" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge"/><rect x="490.0" y="160.0" width="120.0" height="36.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="550.0" y="182.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Apr 1 + 30d</text><path d="M 490 196 L 490 232" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge"/><rect x="620.0" y="160.0" width="120.0" height="36.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="680.0" y="182.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">May 1 + 30d</text><path d="M 620 196 L 620 232" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge"/><text x="425.0" y="286.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="middle">train_end = Mar 15</text><text x="30.0" y="322.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Keep a training row only if T + gap ≤ train_end: its label must be settled before validation starts.</text></svg>

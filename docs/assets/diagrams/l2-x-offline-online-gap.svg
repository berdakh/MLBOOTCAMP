<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img"><desc>A slope chart: offline NDCG on logged clicks ranks the logging policy first and true relevance second; online CTR under the true click model ranks true relevance first, popularity second and the logging policy third.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="370" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">The offline-online gap, in one flip</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Validation-week requests, re-ranked four ways (notebook 12.5). Ranks, best on top.</text><text x="170.0" y="94.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Offline: NDCG@10 on logged clicks</text><text x="710.0" y="94.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Online: CTR, true click model</text><rect x="40.0" y="110.0" width="260.0" height="36.0" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="170.0" y="133.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">1. logging policy · 0.76</text><rect x="580.0" y="110.0" width="260.0" height="36.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="710.0" y="133.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">1. true relevance · 0.18</text><rect x="40.0" y="160.0" width="260.0" height="36.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="170.0" y="183.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">2. true relevance · 0.68</text><rect x="580.0" y="160.0" width="260.0" height="36.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="710.0" y="183.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">2. item popularity · 0.15</text><rect x="40.0" y="210.0" width="260.0" height="36.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="170.0" y="233.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">3. item popularity</text><rect x="580.0" y="210.0" width="260.0" height="36.0" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="710.0" y="233.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">3. logging policy · 0.14</text><rect x="40.0" y="260.0" width="260.0" height="36.0" rx="9" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="170.0" y="283.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">4. random</text><rect x="580.0" y="260.0" width="260.0" height="36.0" rx="9" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="710.0" y="283.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">4. random</text><path d="M 304.0 128.0 L 576.0 228.0" stroke="#cf222e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-bad"/><path d="M 304.0 178.0 L 576.0 128.0" stroke="#1a7f37" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-good"/><path d="M 304.0 228.0 L 576.0 178.0" stroke="#656d76" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-muted_fg"/><path d="M 304.0 278.0 L 576.0 278.0" stroke="#d0d7de" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><rect x="24.0" y="316.0" width="832.0" height="44.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="440.0" y="343.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Logged clicks reward agreeing with the old policy. Only an online test measures the decision itself.</text></svg>

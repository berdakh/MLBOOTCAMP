<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"><desc>Reducer loads for distinct users per seller. Without salting one reducer holds the top seller's pairs and runs about four times the mean load. With the key salted as seller plus hash of user mod 8 the loads are nearly equal, and a second small stage adds the partial counts exactly.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="400" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Skew, and salting</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Distinct users per seller on 8 reducers: one hot key makes one straggler.</text><text x="24.0" y="86.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">Without salt</text><text x="24.0" y="104.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="start">key = seller</text><rect x="24.0" y="124.0" width="34.0" height="126.0" rx="3" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><rect x="70.0" y="228.0" width="34.0" height="22.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><rect x="116.0" y="232.0" width="34.0" height="18.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><rect x="162.0" y="230.0" width="34.0" height="20.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><rect x="208.0" y="234.0" width="34.0" height="16.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><rect x="254.0" y="229.0" width="34.0" height="21.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><rect x="300.0" y="231.0" width="34.0" height="19.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><rect x="346.0" y="233.0" width="34.0" height="17.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><line x1="18" y1="217.6" x2="386" y2="217.6" stroke="#656d76" stroke-width="1.2" stroke-dasharray="4 3"/><text x="388.0" y="212.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">mean</text><line x1="18.0" y1="250.0" x2="386.0" y2="250.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="24.0" y="270.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">reducer 0 … 7</text><text x="386.0" y="270.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="end">max / mean ≈ 3.9</text><text x="476.0" y="86.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">With salt S = 8</text><text x="476.0" y="104.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="start">key = (seller, hash(user) % S)</text><rect x="476.0" y="216.0" width="34.0" height="34.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="522.0" y="218.0" width="34.0" height="32.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="568.0" y="217.0" width="34.0" height="33.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="614.0" y="219.0" width="34.0" height="31.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="660.0" y="215.0" width="34.0" height="35.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="706.0" y="218.0" width="34.0" height="32.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="752.0" y="216.0" width="34.0" height="34.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="798.0" y="217.0" width="34.0" height="33.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><line x1="470" y1="217.0" x2="838" y2="217.0" stroke="#656d76" stroke-width="1.2" stroke-dasharray="4 3"/><text x="840.0" y="212.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">mean</text><line x1="470.0" y1="250.0" x2="838.0" y2="250.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="476.0" y="270.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">reducer 0 … 7</text><text x="838.0" y="270.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="end">max / mean ≈ 1.05</text><text x="476.0" y="300.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">stage 2: add the S partial counts per seller (exact,</text><text x="476.0" y="316.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">because one user always gets the same salt)</text><text x="24.0" y="300.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">the whole job waits for the hot reducer:</text><text x="24.0" y="316.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="start">"99% of tasks finished an hour ago"</text><rect x="24.0" y="340.0" width="832.0" height="40.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="440.0" y="365.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Salt only the hot keys, then re-combine in a second, tiny stage.</text></svg>

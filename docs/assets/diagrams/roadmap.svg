<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Five-day roadmap"><title>Five-day roadmap</title><style>
  .bg{fill:#ffffff} .box{fill:#f4f6fb;stroke:#3b4a6b;stroke-width:1.5}
  .accent{fill:#e3f0ff;stroke:#1f6feb;stroke-width:1.8} .warn{fill:#fff1e6;stroke:#c2410c;stroke-width:1.5}
  .ok{fill:#e8f7ee;stroke:#15803d;stroke-width:1.5} .muted{fill:#f8f8f8;stroke:#9aa3b2;stroke-width:1;stroke-dasharray:4 3}
  .t{font:600 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#1b2333}
  .s{font:12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#4a5568}
  .h{font:700 17px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#1b2333}
  .line{stroke:#3b4a6b;stroke-width:1.6;fill:none} .arrowhead{fill:#3b4a6b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0f1420} .box{fill:#1a2233;stroke:#8da2c9} .accent{fill:#132a4a;stroke:#58a6ff}
    .warn{fill:#3a2414;stroke:#f0883e} .ok{fill:#12301f;stroke:#3fb950} .muted{fill:#161b26;stroke:#5c667a}
    .t,.h{fill:#e6edf3} .s{fill:#a9b4c4} .line{stroke:#8da2c9} .arrowhead{fill:#8da2c9}
  }
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1000" height="300" rx="10"/><text class="h" x="500" y="34" text-anchor="middle">Five days, one project: TaskFlow churn prediction</text><rect class="accent" x="20" y="70" width="170" height="110" rx="8"/><text class="t" x="105.0" y="111.0" text-anchor="middle">Day 1</text><text class="s" x="105.0" y="129.0" text-anchor="middle">Reproducible</text><text class="s" x="105.0" y="144.0" text-anchor="middle">projects</text><text class="s" x="105" y="210" text-anchor="middle">env · data contracts</text><text class="s" x="105" y="228" text-anchor="middle">SQL · splits · baseline</text><path class="line" d="M190,125 L214,125" marker-end="url(#ah)"/><rect class="box" x="216" y="70" width="170" height="110" rx="8"/><text class="t" x="301.0" y="111.0" text-anchor="middle">Day 2</text><text class="s" x="301.0" y="129.0" text-anchor="middle">Evaluate &amp;</text><text class="s" x="301.0" y="144.0" text-anchor="middle">improve</text><text class="s" x="301" y="210" text-anchor="middle">pipelines · CV</text><text class="s" x="301" y="228" text-anchor="middle">thresholds · artifacts</text><path class="line" d="M386,125 L410,125" marker-end="url(#ah)"/><rect class="box" x="412" y="70" width="170" height="110" rx="8"/><text class="t" x="497.0" y="111.0" text-anchor="middle">Day 3</text><text class="s" x="497.0" y="129.0" text-anchor="middle">Serve</text><text class="s" x="497.0" y="144.0" text-anchor="middle">predictions</text><text class="s" x="497" y="210" text-anchor="middle">FastAPI · contracts</text><text class="s" x="497" y="228" text-anchor="middle">clients · tests</text><path class="line" d="M582,125 L606,125" marker-end="url(#ah)"/><rect class="box" x="608" y="70" width="170" height="110" rx="8"/><text class="t" x="693.0" y="111.0" text-anchor="middle">Day 4</text><text class="s" x="693.0" y="129.0" text-anchor="middle">Deploy &amp;</text><text class="s" x="693.0" y="144.0" text-anchor="middle">operate</text><text class="s" x="693" y="210" text-anchor="middle">config · logs · latency</text><text class="s" x="693" y="228" text-anchor="middle">monitoring · rollback</text><path class="line" d="M778,125 L802,125" marker-end="url(#ah)"/><rect class="accent" x="804" y="70" width="170" height="110" rx="8"/><text class="t" x="889.0" y="118.0" text-anchor="middle">Day 5</text><text class="s" x="889.0" y="136.0" text-anchor="middle">Demonstrate</text><text class="s" x="889" y="210" text-anchor="middle">held-out test · docs</text><text class="s" x="889" y="228" text-anchor="middle">drills · mock interview</text><text class="s" x="500" y="275" text-anchor="middle">Then: five independent capstones, one at a time, on public data.</text></svg>

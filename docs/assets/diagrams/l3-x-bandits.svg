<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img"><desc>Left: the bandit loop of choosing an arm, showing the ad, observing a click and updating the Beta posterior, with the selection rules of epsilon-greedy, UCB1 and Thompson sampling. Right: cumulative regret over rounds; uniform play grows linearly and steeply, epsilon-greedy grows linearly with a small slope, Thompson sampling flattens out.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="460" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Explore–exploit: bandits</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Each round: pick an ad, see a click or not, update the beliefs, repeat.</text><rect x="40.0" y="90.0" width="150.0" height="56.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="115.0" y="116.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Choose arm</text><text x="115.0" y="134.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">policy below</text><rect x="250.0" y="90.0" width="150.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="325.0" y="116.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Show the ad</text><text x="325.0" y="134.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">one impression</text><rect x="250.0" y="196.0" width="150.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="325.0" y="222.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Observe</text><text x="325.0" y="240.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">click r ∈ {0, 1}</text><rect x="40.0" y="196.0" width="150.0" height="56.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="115.0" y="222.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Update</text><text x="115.0" y="240.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">α += r, β += 1 − r</text><line x1="190.0" y1="118.0" x2="246.0" y2="118.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="325.0" y1="146.0" x2="325.0" y2="192.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="250.0" y1="224.0" x2="194.0" y2="224.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="115.0" y1="196.0" x2="115.0" y2="150.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><text x="40.0" y="290.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">ε-greedy</text><text x="130.0" y="290.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">best mean; random arm with prob ε</text><text x="40.0" y="314.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">UCB1</text><text x="130.0" y="314.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">argmax mean + √(2 ln t / n_arm)</text><text x="40.0" y="338.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">Thompson</text><text x="130.0" y="338.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">θ_k ~ Beta(α_k, β_k); play argmax θ</text><path d="M 500 330 L 850 330" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><path d="M 500 330 L 5
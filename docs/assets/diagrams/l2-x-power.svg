Font, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">H₀: no effect</text><text x="480.0" y="125.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#0969da" class="d-t-accent" text-anchor="middle">H₁: true effect δ</text><line x1="250.0" y1="322.0" x2="480.0" y2="322.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><text x="365.0" y="340.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">δ = the minimum detectable effect, in standard errors</text><rect x="690" y="132" width="14" height="14" rx="3" fill="#9a6700" fill-opacity="0.55" stroke="#9a6700" stroke-width="1"/><text x="712.0" y="144.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">α = 0.05: false alarm</text><rect x="690" y="162" width="14" height="14" rx="3" fill="#cf222e" fill-opacity="0.18" stroke="#cf222e" stroke-width="1"/><text x="712.0" y="174.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">β = 0.2: missed effect</text><rect x="690" y="192" width="14" height="14" rx="3" fill="#1a7f37" fill-opacity="0.18" stroke="#1a7f37" stroke-width="1"/><text x="712.0" y="204.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">1 − β = 0.8: power</text><rect x="24.0" y="346.0" width="832.0" height="44.0" rx="9" fil
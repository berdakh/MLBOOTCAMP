<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"><desc>Two bell curves of the test statistic: under the null hypothesis centred at zero, under the alternative centred at the true effect delta. The critical value at 1.96 cuts off alpha in the null's right tail; the alternative's mass left of the line is beta, the rest is power.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="400" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Power: two distributions of the test statistic</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Under H₀ the statistic centres on 0; under H₁ it centres on the true effect δ.</text><path d="M 200.0 300.0 L 200.0 299.9 L 203.1 299.9 L 206.2 299.9 L 209.4 299.9 L 212.5 299.9 L 215.6 299.9 L 218.7 299.8 L 221.8 299.8 L 225.0 299.8 L 228.1 299.7 L 231.2 299.7 L 234.3 299.7 L 237.4 299.6 L 240.6 299.5 L 243.7 299.4 L 246.8 299.4 L 249.9 299.3 L 253.0 299.1 L 256.2 299.0 L 259.3 298.9 L 262.4 298.7 L 265.5 298.5 L 268.6 298.3 L 271.8 298.0 L 274.9 297.7 L 278.0 297.4 L 281.1 297.1 L 284.2 296.7 L 287.4 296.3 L 290.5 295.8 L 293.6 295.2 L 296.7 294.6 L 299.8 294.0 L 303.0 293.3 L 306.1 292.5 L 309.2 291.6 L 312.3 290.6 L 315.4 289.6 L 318.6 288.5 L 321.7 287.2 L 324.8 285.9 L 
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img"><desc>A timeline with price records valid from day 3 ($20), day 10 ($18) and day 20 ($15), and impressions on days 5, 12 and 25. The as-of join gives each impression the latest price at or before its time: $20, $18 and $15. A plain join to today's price would give every impression $15.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="380" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">As-of join: the price when the item was shown</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">For each event: the latest record with the same key and ts ≤ event ts.</text><line x1="40.0" y1="200.0" x2="850.0" y2="200.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><text x="850.0" y="222.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">time (days)</text><rect x="94.0" y="92.0" width="100.0" height="54.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="144.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">price $20</text><text x="144.0" y="128.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">valid from</text><text x="144.0" y="142.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">day 3</text><line x1="144.0" y1="148.0" x2="144.0" y2="196.0" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge" marker-end="url(#ah)"/><rect x="290.0" y="92.0" width="100.0" height="54.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="340.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">price $18</text><text x="340.0" y="128.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">valid from</text><text x="340.0" y="142.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">day 10</text><line x1="340.0" y1="148.0" x2="340.0" y2="196.0" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge" marker-end="url(#ah)"/><rect x="570.0" y="92.0" width="100.0" height="54.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="620.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">price $15</text><text x="620.0" y="128.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">valid from</text><text x="620.0" y="142.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">day 20</text><line x1="620.0" y1="148.0" x2="620.0" y2="196.0" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge" marker-end="url(#ah)"/><circle cx="200.0" cy="200.0" r="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="140.0" y="240.0" width="120.0" height="54.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="200.0" y="265.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">shown day 5</text><text x="200.0" y="283.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">gets $20</text><line x1="200.0" y1="238.0" x2="200.0" y2="208.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><path d="M 194 188 L 152 188" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><circle cx="396.0" cy="200.0" r="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="336.0" y="240.0" width="120.0" height="54.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="396.0" y="265.0" font-family='-apple-system, BlinkMacSystemFont, 
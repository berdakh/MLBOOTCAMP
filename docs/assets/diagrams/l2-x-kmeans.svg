<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"><desc>Three panels: k-means++ picks three spread-out initial centres; each point is assigned to its nearest centre; each centre moves to the mean of its points. Assign and move repeat until the labels stop changing.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="400" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">k-means: assign, move, repeat</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Lloyd's algorithm. Both steps can only lower the objective, so it stops, at a local minimum.</text><rect x="24.0" y="96.0" width="256.0" height="200.0" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="152.0" y="86.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">1 · Initialise (k-means++)</text><rect x="312.0" y="96.0" width="256.0" height="200.0" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="440.0" y="86.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">2 · Assign to nearest centre</text><rect x="600.0" y="96.0" width="256.0" height="200.0" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="728.0" y="86.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">3 · Move centre to the mean</text><circle cx="97.4" cy="184.2" r="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><circle cx="385.4" cy="184.2" r="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="673.4" cy="184.2" r="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="97.9" cy="171.0" r="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><circle cx="385.9" cy="171.0" r="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="673.9" cy="171.0" r="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="85.3" cy="172.6" r="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><circle cx="373.3" cy="172.6" r="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="661.3" cy="172.6" r="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="122.0" cy="182.8" r="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><circle cx="410.0" cy="182.8" r="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="698.0" cy="182.8" r="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="120.7" cy="180.0" r="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><circle cx="408.7" cy="180.0" r="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><cir
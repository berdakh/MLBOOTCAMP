<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img"><desc>Left: elliptical contours of the logistic loss with gradient-descent steps zig-zagging to the unique minimum. Right: the four lines of the model - logits, sigmoid, the gradient p minus y over n, and the weight gradient with L2.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="390" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Logistic regression: one gradient, one bowl</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">The loss is convex, so gradient descent reaches the single minimum from any start.</text><ellipse cx="230" cy="196" rx="176" ry="90" transform="rotate(-22 230 196)" fill="none" stroke="#d0d7de" stroke-width="1.6"/><ellipse cx="230" cy="196" rx="120" ry="62" transform="rotate(-22 230 196)" fill="none" stroke="#d0d7de" stroke-width="1.6"/><ellipse cx="230" cy="196" rx="66" ry="35" transform="rotate(-22 230 196)" fill="none" stroke="#d0d7de" stroke-width="1.6"/><ellipse cx="230" cy="196" rx="24" ry="13" transform="rotate(-22 230 196)" fill="none" stroke="#d0d7de" stroke-width="1.6"/><path d="M 84.0 140.0 L 154.0 262.0 L 178.0 166.0 L 222.0 230.0 L 214.0 182.0 L 236.0 206.0 L 230.0 196.0" stroke="#0969da" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-accent"/><circle cx="84" cy="140" r="3.5" fill="#0969da"/><circle cx="154" cy="262" r="3.5" fill="#0969da"/><circle cx="178" cy="166" r="3.5" fill="#0969da"/><circle cx="222" cy="230" r="3.5" fill="#0969da"/><circle cx="214" cy="182" r="3.5" fill="#0969da"/><circle cx="236" cy="206" r="3.5" fill="#0969da"/><circle cx="230.0" cy="196.0" r="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="84.0" y="128.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">w = 0</text><text x="230.0" y="314.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="middle">minimum: unique (convex loss)</text><text x="230.0" y="332.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">zig-zag: features on different scales → standardise</text><rect x="500.0" y="84.0" width="330.0" height="48.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="665.0" y="106.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">z = Xw + b</text><text x="665.0" y="124.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">logits, shape (n,)</text><rect x="500.0" y="148.0" width="330.0" height="48.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="665.0" y="170.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">p = σ(z)</text><text x="665.0" y="188.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">predicted probabilities</text><line x1="665.0" y1="133.0" x2="665.0" y2="145.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="500.0" y="212.0" width="330.0" height="48.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="665.0" y="234.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">∂L/∂z = (p − y) / n</text><text x="665.0" y="252.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">prediction minus target</text><line x1="665.0" y1="197.0" x2="665.0" y2="209.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="500.0" y="276.0" width="330.0" height="48.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="665.0" y="298.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">∇w = Xᵀ(p − y)/n + λw</text><text x="665.0" y="316.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">then w ← w − lr · ∇w</text><line x1="665.0" y1="261.0" x2="665.0" y2="273.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="24.0" y="356.0" width="832.0" height="28.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="440.0" y="375.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">The same “prediction minus target” gradient appears for softmax and for squared loss.</text></svg>

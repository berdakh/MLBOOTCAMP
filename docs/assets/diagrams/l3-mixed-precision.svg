<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"><desc>A log-scale number line of gradient magnitudes. In fp16, values below about 6e-8 become zero, values up to 6e-5 are imprecise subnormals, and values above 65,504 overflow to infinity. Raw gradients centred around 1e-6 partly fall into the underflow zones; multiplying the loss by 2 to the 16 shifts them into the normal range.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="400" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">fp16 range and loss scaling</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Tiny gradients underflow to zero in fp16; multiplying the loss by S lifts them into range.</text><path d="M 80.0 250.0 L 800.0 250.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><path d="M 80.0 246.0 L 80.0 254.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="80.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">1e-10</text><path d="M 170.0 246.0 L 170.0 254.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="170.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">1e-8</text><path d="M 260.0 246.0 L 260.0 254.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="260.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">1e-6</text><path d="M 350.0 246.0 L 350.0 254.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="350.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">1e-4</text><path d="M 440.0 246.0 L 440.0 254.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="440.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">1e-2</text><path d="M 530.0 246.0 L 530.0 254.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="530.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">1e0</text><path d="M 620.0 246.0 L 620.0 254.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="620.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">1e2</text><path d="M 710.0 246.0 L 710.0 254.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="710.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">1e4</text><path d="M 800.0 246.0 L 800.0 254.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="800.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">1e6</text><text x="440.0" y="288.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">magnitude of a gradient value (log scale)</text><rect x="80.0" y="302.0" width="125.0" height="22.0" rx="3" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="142.5" y="317.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">→ 0</text><rect x="205.0" y="302.0" width="135.3" height="22.0" rx="3" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="272.7" y="317.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">subnormal</text><rect x="340.3" y="302.0" width="406.4" height="22.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="543.5" y="317.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">fp16 normal range</text><rect x="746.7" y="302.0" width="53.3" height="22.0" rx="3" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="773.4" y="317.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">inf</text><text x="72.0" y="318.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">fp16</text><path d="M 116.0 245.9 L 120.5 245.8 L 125.0 245.7 L 129.5 245.6 L 134.0 245.4 L 138.5 245.1 L 143.0 244.7 L 147.5 244.1 L 152.0 243.3 L 156.5 242.3 L 161.0 240.9 L 165.5 239.2 L 170.0 236.9 L 174.5 234.1 L 179.0 230.6 L 183.5 226.5 L 188.0 221.6 L 192.5 216.0 L 197.0 209.7 L 201.5 202.6 L 206.0 195.0 L 210.5 187.0 L 215.0 178.8 L 219.5 170.5 L 224.0 162.6 L 228.5 155.2 L 233.0 148.7 L 237.5 143.4 L 242.0 139.3 L 246.5 136.8 L 251.0 136.0 L 255.5 136.8 L 260.0 139.3 L 264.5 143.4 L 269.0 148.7 L 273.5 155.2 L 278.0 162.6 L 282.5 170.5 L 287.0 178.8 L 291.5 187.0 L 296.0 195.0 L 300.5 202.6 L 305.0 209.7 L 309.5 216.0 L 314.0 221.6 L 318.5 226.5 L 323.0 230.6 L 327.5 234.1 L 332.0 236.9 L 336.5 239.2 L 341.0 240.9 L 345.5 242.3 L 350.0 243.3 L 354.5 244.1 L 359.0 244.7 L 363.5 245.1 L 368.0 245.4 L 372.5 245.6 L 377.0 245.7 L 381.5 245.8 L 386.0 245.9" stroke="#cf222e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-bad"/><text x="251.0" y="102.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="middle">raw gradients</text><text x="251.0" y="116.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="middle">median ~1e-6</text><path d="M 332.0 245.9 L 336.5 245.8 L 341.0 245.7 L 345.5 245.6 L 350.0 245.4 L 354.5 245.1 L 359.0 244.7 L 363.5 244.1 L 368.0 243.3 L 372.5 242.3 L 377.0 240.9 L 381.5 239.2 L 386.0 236.9 L 390.5 234.1 L 395.0 230.6 L 399.5 226.5 L 404.0 221.6 L 408.5 216.0 L 413.0 209.7 L 417.5 202.6 L 422.0 195.0 L 426.5 187.0 L 431.0 178.8 L 435.5 170.5 L 440.0 162.6 L 444.5 155.2 L 449.0 148.7 L 453.5 143.4 L 458.0 139.3 L 462.5 136.8 L 467.0 136.0 L 471.5 136.8 L 476.0 139.3 L 480.5 143.4 L 485.0 148.7 L 489.5 155.2 L 494.0 162.6 L 498.5 170.5 L 503.0 178.8 L 507.5 187.0 L 512.0 195.0 L 516.5 202.6 L 521.0 209.7 L 525.5 216.0 L 530.0 221.6 L 534.5 226.5 L 539.0 230.6 L 543.5 234.1 L 548.0 236.9 L 552.5 239.2 L 557.0 240.9 L 561.5 242.3 L 566.0 243.3 L 570.5 244.1 L 575.0 244.7 L 579.5 245.1 L 584.0 245.4 L 588.5 245.6 L 593.0 245.7 L 597.5 245.8 L 602.0 245.9" stroke="#1a7f37" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-good"/><text x="467.0" y="102.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="middle">× S = 2¹⁶</text><text x="467.0" y="116.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="middle">all representable</text><line x1="323.0" y1="170.0" x2="395.0" y2="170.0" stroke="#0969d
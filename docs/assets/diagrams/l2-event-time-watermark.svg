<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img"><desc>A scatter of events with arrival time on the horizontal axis and event time on the vertical axis, all below the no-delay diagonal. The watermark is a staircase that trails the maximum event time seen by the allowed lateness. One event that happened early but arrived late falls below the watermark: it is late.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="420" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Event time, processing time and the watermark</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Each dot is one event: when it happened (up) vs when it arrived (right).</text><line x1="80.0" y1="330.0" x2="558.4" y2="330.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="80.0" y1="330.0" x2="80.0" y2="92.4" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><text x="558.4" y="352.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">processing time (arrival) →</text><text x="70.0" y="84.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">event time ↑</text><path d="M 80 330 L 540 110" stroke="#d0d7de" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-stroke"/><text x="536.0" y="102.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">no delay</text><path d="M 139.8 330.0 L 181.2 330.0 L 181.2 308.0 L 222.6 308.0 L 222.6 294.8 L 254.8 294.8 L 254.8 275.0 L 305.4 275.0 L 305.4 259.6 L 328.4 259.6 L 328.4 242.0 L 383.6 242.0 L 383.6 220.0 L 411.2 220.0 L 411.2 202.4 L 452.6 202.4 L 452.6 187.0 L 494.0 187.0 L 494.0 162.8 L 540.0 162.8" stroke="#9a6700" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-warn"/><text x="546.0" y="166.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#9a6700" class="d-t-warn" text-anchor="start">watermark</text><circle cx="139.8" cy="308.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="181.2" cy="286.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="222.6" cy="272.8" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="254.8" cy="253.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="305.4" cy="237.6" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="328.4" cy="220.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="383.6" cy="198.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="411.2" cy="180.4" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="452.6" cy="165.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="494.0" cy="140.8" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="466.4" cy="264.0" r="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="466.4" y="288.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="middle">late event</text><rect x="620.0" y="90.0" width="236.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="738.0" y="116.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Event time</text><text x="738.0" y="134.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">when it happened (features)</text><rect x="620.0" y="158.0" width="236.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="738.0" y="184.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Processing time</text><text x="738.0" y="202.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">when it arrived: network, retries</text><rect x="620.0" y="226.0" width="236.0" height="70.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="738.0" y="245.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Watermark W</text><text x="738.0" y="263.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">max event time seen − allowed</text><text x="738.0" y="277.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">lateness; window closes when W ≥</text><text x="738.0" y="291.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">its end</text><rect x="24.0" y="356.0" width="832.0" height="40.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="440.0" y="381.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">More allowed lateness: fewer late events, but later results and more open windows.</text></svg>

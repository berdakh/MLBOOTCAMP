<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img"><desc>A schedule grid for four pipeline stages and four micro-batches. Forward passes form a staircase down the stages, backward passes a reversed staircase; the empty triangles at the start and end are idle time, the bubble, a fraction (p-1)/(m+p-1) = 3/7 of the step.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="380" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Pipeline parallelism and the bubble</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">GPipe, p = 4 stages, m = 4 micro-batches; backward takes 2 units.</text><text x="98.0" y="107.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">GPU 0</text><rect x="110.0" y="84.0" width="672.0" height="38.0" rx="4" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="111.0" y="86.0" width="30.0" height="34.0" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="126.0" y="107.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-seri
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Serving architecture"><title>Serving architecture</title><style>
  .bg{fill:#ffffff} .box{fill:#f4f6fb;stroke:#3b4a6b;stroke-width:1.5}
  .accent{fill:#e3f0ff;stroke:#1f6feb;stroke-width:1.8} .warn{fill:#fff1e6;stroke:#c2410c;stroke-width:1.5}
  .ok{fill:#e8f7ee;stroke:#15803d;stroke-width:1.5} .muted{fill:#f8f8f8;stroke:#9aa3b2;stroke-width:1;stroke-dasharray:4 3}
  .t{font:600 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#1b2333}
  .s{font:12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#4a5568}
  .h{font:700 17px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#1b2333}
  .line{stroke:#3b4a6b;stroke-width:1.6;fill:none} .arrowhead{fill:#3b4a6b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0f1420} .box{fill:#1a2233;stroke:#8da2c9} .accent{fill:#132a4a;stroke:#58a6ff}
    .warn{fill:#3a2414;stroke:#f0883e} .ok{fill:#12301f;stroke:#3fb950} .muted{fill:#161b26;stroke:#5c667a}
    .t,.h{fill:#e6edf3} .s{fill:#a9b4c4} .line{stroke:#8da2c9} .arrowhead{fill:#8da2c9}
  }
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1000" height="330" rx="10"/><text class="h" x="500" y="32" text-anchor="middle">Inside the prediction service</text><rect class="box" x="20" y="120" width="150" height="80" rx="8"/><text class="t" x="95.0" y="146.0" text-anchor="middle">Caller</text><text class="s" x="95.0" y="164.0" text-anchor="middle">JSON request</text><text class="s" x="95.0" y="179.0" text-anchor="middle">x-request-id</text><rect class="accent" x="220" y="70" width="230" height="180" rx="3"/><text class="t" x="335" y="98" text-anchor="middle">FastAPI app</text><text class="s" x="335" y="130" text-anchor="middle">middleware: id · timing · log</text><text class="s" x="335" y="160" text-anchor="middle">Pydantic contract → 422</text><text class="s" x="335" y="190" text-anchor="middle">/predict  /predict/batch</text><text class="s" x="335" y="220" text-anchor="middle">/health  /ready  /metrics</text><rect class="box" x="500" y="120" width="180" height="80" rx="8"/><text class="t" x="590.0" y="146.0" text-anchor="middle">ModelHolder</text><text class="s" x="590.0" y="164.0" text-anchor="middle">pipeline in memory</text><text class="s" x="590.0" y="179.0" text-anchor="middle">swap under a lock</text><rect class="ok" x="730" y="60" width="240" height="80" rx="8"/><text class="t" x="850.0" y="86.0" text-anchor="middle">Registry</text><text class="s" x="850.0" y="104.0" text-anchor="middle">immutable v1 v2 v3</text><text class="s" x="850.0" y="119.0" text-anchor="middle">CURRENT pointer</text><rect class="warn" x="730" y="180" width="240" height="80" rx="8"/><text class="t" x="850.0" y="206.0" text-anchor="middle">Logs &amp; metrics</text><text class="s" x="850.0" y="224.0" text-anchor="middle">JSON lines · p50/p95</text><text class="s" x="850.0" y="239.0" text-anchor="middle">recent inputs → drift</text><path class="line" d="M170,160 L218,160" marker-end="url(#ah)"/><path class="line" d="M450,160 L498,160" marker-end="url(#ah)"/><path class="line" d="M728,100 L682,140" marker-end="url(#ah)"/><text class="s" x="600" y="98" text-anchor="middle">load at start / reload</text><path class="line" d="M682,175 L728,210" marker-end="url(#ah)"/><text class="s" x="500" y="300" text-anchor="middle">The saved object includes preprocessing, so the service cannot transform inputs differently from training.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img"><desc>Three U-shaped curves of loss against model size for compute budgets C, 10C and 100C; the minimum of each moves to larger models and lower loss, and a dashed line through the minima is the compute-optimal frontier. Beside it: C is about 6 N D, Chinchilla's D is about 20 N, so N equals the square root of C over 120.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="420" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Compute-optimal model size</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">For each compute budget, loss vs model size is a U; the minima trace the frontier.</text><path d="M 80.0 320.0 L 500.0 320.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><path d="M 80.0 80.0 L 80.0 320.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="290.0" y="342.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">model size N (log) — fixed C, so more N means fewer tokens D</text><text x="70.0" y="90.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">loss</text><path d="M 80.0 102.8 L 84.5 112.3 L 89.0 121.3 L 93.5 129.8 L 98.0 137.8 L 102.5 145.3 L 107.0 152.4 L 111.5 158.9 L 116.0 165.0 L 120.5 170.6 L 125.0 175.7 L 129.5 180.3 L 134.0 184.4 L 138.5 188.1 L 143.0 191.3 L 147.5 193.9 L 152.0 196.1 L 156.5 197.8 L 161.0 199.0 L 165.5 199.8 L 170.0 200.0 L 174.5 199.8 L 179.0 199.0 L 183.5 197.8 L 188.0 196.1 L 192.5 193.9 L 197.0 191.3 L 201.5 188.1 L 206.0 184.4 L 210.5 180.3 L 215.0 175.7 L 219.5 170.6 L 224.0 165.0 L 228.5 158.9 L 233.0 152.4 L 237.5 145.3 L 242.0 137.8 L 246.5 129.8 L 251.0 121.3 L 255.5 112.3 L 260.0 102.8" stroke="#656d76" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-muted_fg"/><text x="266.0" y="106.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">C</text><path d="M 200.0 147.8 L 204.5 157.3 L 209.0 166.3 L 213.5 174.8 L 218.0 182.8 L 222.5 190.3 L 227.0 197.4 L 231.5 203.9 L 236.0 210.0 L 240.5 215.6 L 245.0 220.7 L 249.5 225.3 L 254.0 229.4 L 258.5 233.1 L 263.0 236.3 L 267.5 238.9 L 272.0 241.1 L 276.5 242.8 L 281.0 244.0 L 285.5 244.8 L 290.0 245.0 L 294.5 244.8 L 299.0 244.0 L 303.5 242.8 L 308.0 241.1 L 312.5 238.9 L 317.0 236.3 L 321.5 233.1 L 326.0 229.4 L 330.5 225.3 L 335.0 220.7 L 339.5 215.6 L 344.0 210.0 L 348.5 203.9 L 353.0 197.4 L 357.5 190.3 L 362.0 182.8 L 366.5 174.8 L 371.0 166.3 L 375.5 157.3 L 380.0 147.8" stroke="#0969da" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-accent"/><text x="386.0" y="151.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">10C</text><path d="M 320.0 192.8 L 324.5 202.3 L 329.0 211.3 L 333.5 219.8 L 338.0 227.8 L 342.5 235.3 L 347.0 242.4 L 351.5 248.9 L 356.0 255.0 L 360.5 260.6 L 365.0 265.7 L 369.5 270.3 L 374.0 274.4 L 378.5 278.1 L 383.0 281.3 L 387.5 283.9 L 392.0 286.1 L 396.5 287.8 L 401.0 289.0 L 405.5 289.8 L 410.0 290.0 L 414.5 289.8 L 419.0 289.0 L 423.5 287.8 L 428.0 286.1 L 432.5 283.9 L 437.0 281.3 L 441.5 278.1 L 446.0 274.4 L 450.5 270.3 L 455.0 265.7 L 459.5 260.6 L 464.0 255.0 L 468.5 248.9 L 473.0 242.4 L 477.5 235.3 L 482.0 227.8 L 486.5 219.8 L 491.0 211.3 L 495.5 202.3 L 500.0 192.8" stroke="#1a7f37" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-good"/><text x="506.0" y="196.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">100C</text><path d="M 170.0 200.0 L 290.0 245.0 L 410.0 290.0" stroke="#cf222e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-bad"/><circle cx="170.0" cy="200.0" r="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><circle cx="290.0" cy="245.0" r="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><circle cx="410.0" cy="290.0" r="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="422.0" y="308.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="start">frontier</text><rect x="540.0" y="80.0" width="316.0" height="56.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="698.0" y="106.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">C ≈ 6 · N · D</text><text x="698.0" y="124.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">FLOPs: 2N forward + 4N backward per token</text><rect x="540.0" y="148.0" width="316.0" height="56.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="698.0" y="174.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Chinchilla: D ≈ 20 · N</text><text x="698.0" y="192.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">N and D both grow as √C</text><rect x="540.0" y="216.0" width="316.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="698.0" y="242.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">N = √(C / 120)</text><text x="698.0" y="260.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">5.9e23 FLOPs → 70B params, 1.4T tokens</text><rect x="540.0" y="284.0" width="316.0" height="46.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="698.0" y="311.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Serving-heavy? Train past 20 D/N</text><rect x="24.0" y="360.0" width="832.0" height="40.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="440.0" y="385.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Given a budget, size the model and data together; a bigger model on too few tokens wastes compute.</text></svg>

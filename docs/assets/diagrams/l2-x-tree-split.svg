<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" width="880" height="464" role="img"><desc>Eight points sorted by a feature, with dashed candidate thresholds between each pair; the best threshold separates a low group from a high group. Below, the summed SSE of the two children at each candidate, lowest at the best threshold.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="464" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Finding the best split: try every gap, keep the lowest SSE</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">A regression stump on one feature. Sort once; prefix sums give every split in O(1).</text><line x1="80.0" y1="240.0" x2="640.0" y2="240.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="360.0" y="258.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">feature x, sorted</text><line x1="145.0" y1="110.0" x2="145.0" y2="240.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="215.0" y1="110.0" x2="215.0" y2="240.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="285.0" y1="110.0" x2="285.0" y2="240.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="355.0" y1="92" x2="355.0" y2="240" stroke="#0969da" stroke-width="2.2"/><line x1="425.0" y1="110.0" x2="425.0" y2="240.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="495.0" y1="110.0" x2="495.0" y2="240.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="565.0" y1="110.0" x2="565.0" y2="240.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><path d="M 90.0 199.0 L 340.0 199.0" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-good"/><path d="M 370.0 118.0 L 620.0 118.0" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-good"/><circle cx="110.0" cy="200.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="180.0" cy="192.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="250.0" cy="208.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="320.0" cy="196.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="390.0" cy="120.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="460.0" cy="112.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="530.0" cy="124.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="600.0" cy="116.0" r="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="355.0" y="86.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="middle">best threshold</text><text x="215.0" y="225.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="middle">left mean</text><text x="495.0" y="104.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="middle">right mean</text><line x1="80.0" y1="372.0" x2="640.0" y2="372.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><path d="M 145.0 296.0 L 215.0 306.0 L 285.0 331.4 L 355.0 358.8 L 425.0 330.7 L 495.0 307.2 L 565.0 296.5" stroke="#656d76" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-muted_fg"/><circle cx="145.0" cy="296.0" r="4.5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><circle cx="215.0" cy="306.0" r="4.5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><circle cx="285.0" cy="331.4" r="4.5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><circle cx="355.0" cy="358.8" r="4.5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><circle cx="425.0" cy="330.7" r="4.5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><circle cx="495.0" cy="307.2" r="4.5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><circle cx="565.0" cy="296.5" r="4.5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="84.0" y="284.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">SSE(left) + SSE(right) at each gap</text><text x="355.0" y="388.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="middle">minimum: 0.14</text><rect x="668.0" y="100.0" width="188.0" height="66.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="762.0" y="131.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">SSE = S₂ − S₁²/m</text><text x="762.0" y="149.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">S₁ = Σy, S₂ = Σy², m = size</text><rect x="668.0" y="180.0" width="188.0" height="66.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="762.0" y="204.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Prefix sums</text><text x="762.0" y="222.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">cumsum(y), cumsum(y²) give</text><text x="762.0" y="236.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">every left child</text><rect x="668.0" y="260.0" width="188.0" height="66.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="762.0" y="284.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Only between distinct x</text><text x="762.0" y="302.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">equal values must stay</text><text x="762.0" y="316.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">together</text><rect x="24.0" y="404.0" width="832.0" height="44.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="440.0" y="431.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Gain = SSE(parent) − SSE(left) − SSE(right), the variance reduction. Sort in O(n log n), all splits in O(n).</text></svg>

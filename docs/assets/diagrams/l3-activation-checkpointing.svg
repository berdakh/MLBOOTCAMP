<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" role="img"><desc>Two rows of four transformer blocks. In standard training every block keeps all of its internal activations for backward (82 MB here). With checkpointing each block keeps only its small input and recomputes its internals during backward (14 MB here), costing about one extra forward pass.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="384" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Activation checkpointing: trade compute for memory</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Keep only each block's input; recompute the inside during backward.</text><text x="24.0" y="108.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">Standard</text><text x="24.0" y="126.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">keep everything</text><rect x="170.0" y="84.0" width="100.0" height="36.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="220.0" y="106.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">block 1</text><line x1="270.0" y1="102.0" x2="288.0" y2="102.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="170.0" y="128.0" width="100.0" height="40.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="220.0" y="152.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">all internals</text><rect x="290.0" y="84.0" width="100.0" height="36.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="340.0" y="106.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">block 2</text><line x1="390.0" y1="102.0" x2="408.0" y2="102.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="290.0" y="128.0" width="100.0" height="40.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="340.0" y="152.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">all internals</text><rect x="410.0" y="84.0" width="100.0" height="36.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="460.0" y="106.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">block 3</text><line x1="510.0" y1="102.0" x2="528.0" y2="102.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="410.0" y="128.0" width="100.0" height="40.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="460.0" y="152.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">all internals</text><rect x="530.0" y="84.0" width="100.0" height="36.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="580.0" y="106.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">block 4</text><rect x="530.0" y="128.0" width="100.0" height="40.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="580.0" y="152.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">all internals</text><text x="24.0" y="228.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">Checkpointed</text><text x="24.0" y="246.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">keep inputs only</text><rect x="170.0" y="204.0" width="100.0" height="36.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="220.0" y="226.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">block 1</text><line x1="270.0" y1="222.0" x2="288.0" y2="222.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="170.0" y="248.0" width="30.0" height="40.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="204.0" y="248.0" width="66.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="237.0" y="272.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">recompute</text><rect x="290.0" y="204.0" width="100.0" height="36.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="340.0" y="226.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">block 2</text><line x1="390.0" y1="222.0" x2="408.0" y2="222.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="290.0" y="248.0" width="30.0" height="40.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="324.0" y="248.0" width="66.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="357.0" y="272.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">recompute</text><rect x="410.0" y="204.0" width="100.0" height="36.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="460.0" y="226.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">block 3</text><line x1="510.0" y1="222.0" x2="528.0" y2="222.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="410.0" y="248.0" width="30.0" height="40.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="444.0" y="248.0" width="66.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="477.0" y="272.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">recompute</text><rect x="530.0" y="204.0" width="100.0" height="36.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="580.0" y="226.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">block 4</text><rect x="530.0" y="248.0" width="30.0" height="40.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="564.0" y="248.0" width="66.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="597.0" y="272.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">recompute</text><text x="660.0" y="112.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#cf222e" class="d-t-bad" text-anchor="start">82 MB saved</text><text x="660.0" y="130.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">for backward (2.4)</text><text x="660.0" y="232.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1a7f37" class="d-t-good" text-anchor="start">14 MB saved</text><text x="660.0" y="250.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">+20-40% step time</text><text x="660.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">gradients identical</text><text x="170.0" y="306.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">green = the block's input, kept · dashed = rebuilt during backward</text><rect x="24.0" y="324.0" width="832.0" height="40.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="440.0" y="349.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Memory: one input per block + one block at a time. Cost: about one extra forward pass.</text></svg>

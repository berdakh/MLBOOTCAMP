"13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">A page with 20 calls</text><text x="755.0" y="243.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">hits a slower-than-p95 call</text><text x="755.0" y="257.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">64% of the time</text><text x="30.0" y="340.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Report p50, p95, p99 and the request count, on a named machine.</text></svg>

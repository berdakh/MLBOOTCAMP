ly='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">8</text><rect x="818.0" y="200.0" width="28.0" height="80.0" rx="3" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="818.0" y="121.1" width="28.0" height="78.9" rx="3" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="832.0" y="298.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">9</text><line x1="470" y1="200" x2="856" y2="200" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="6 4"/><text x="470.0" y="194.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="start">M = 4</text><text x="818.0" y="115.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">7.9</text><line x1="470.0" y1="280.0" x2="856.0" y2="280.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="470.0" y="318.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">dashed part is cut by the clip: less variance, more bias</text><rect x="24.0" y="336.0" width="832.0" height="40.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="440.0" y="361.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">E[click / θ_p] = θ_p · r / θ_p = r: unbiased, but noisy where θ_p is small.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img"><desc>Two timelines. On the CPU, Python launches kernels A, B and C in microseconds and moves on; on the GPU the kernels run later, one after another. Reading the clock right after the launches measures only launch cost; synchronizing before reading the clock measures the real work.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="380" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">GPU kernels launch asynchronously</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">The CPU only queues the work and races ahead; the GPU runs it later.</text><text x="24.0" y="112.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">CPU (Python)</text><text x="24.0" y="192.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">GPU stream</text><rect x="150.0" y="90.0" width="80.0" height="40.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="190.0" y="114.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">launch A</text><rect x="240.0" y="90.0" width="80.0" height="40.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="280.0" y="114.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">launch B</text><rect x="330.0" y="90.0" width="80.0" height="40.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="370.0" y="114.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">launch C</text><rect x="420.0" y="90.0" width="110.0" height="40.0" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="475.0" y="114.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">t1 = clock()</text><rect x="540.0" y="90.0" width="150.0" height="40.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="615.0" y="114.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">synchronize: wait</text><rect x="700.0" y="90.0" width="110.0" height="40.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="755.0" y="114.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">t1 = clock()</text><rect x="190.0" y="170.0" width="170.0" height="40.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="275.0" y="195.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">kernel A runs</text><rect x="370.0" y="170.0" width="170.0" height="40.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="455.0" y="195.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">kernel B runs</text><rect x="550.0" y="170.0" width="170.0" height="40.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="635.0" y="195.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">kernel C runs</text><line x1="190.0" y1="132.0" x2="200.0" y2="166.0" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge" marker-end="url(#ah)"/><line x1="280.0" y1="132.0" x2="380.0" y2="166.0" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge" marker-end="url(#ah)"/><line x1="370.0" y1="132.0" x2="560.0" y2="166.0" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge" marker-end="url(#ah)"/><line x1="690.0" y1="190.0" x2="696.0" y2="132.0" stroke="#d0d7de" stroke-width="1.8" fill="none" stroke-dasharray="5 4" class="d-edge" marker-end="url(#ah)"/><path d="M 150.0 246.0 L 530.0 246.0" stroke="#cf222e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-bad"/><path d="M 150.0 239.0 L 150.0 253.0" stroke="#cf222e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-bad"/><path d="M 530.0 239.0 L 530.0 253.0" stroke="#cf222e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-bad"/><text x="340.0" y="266.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="middle">timed without sync: launch cost only (~0.1 ms)</text><path d="M 150.0 290.0 L 810.0 290.0" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-good"/><path d="M 150.0 283.0 L 150.0 297.0" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-good"/><path d="M 810.0 283.0 L 810.0 297.0" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-good"/><text x="480.0" y="310.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="middle">synchronize before and after: the real work</text><rect x="24.0" y="324.0" width="832.0" height="40.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="440.0" y="349.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Warm up, synchronize before and after, repeat, report the median.</text></svg>

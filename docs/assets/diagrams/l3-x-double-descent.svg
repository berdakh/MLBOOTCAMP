<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img"><desc>Test error against the number of random features on a log scale. The minimum-norm fit's error falls, spikes at the interpolation threshold where the number of features equals the number of training points, then descends again below its earlier minimum. A ridge-regularised fit has no peak. Side boxes give the notebook's numbers and the reasons.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="420" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Double descent</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Test error vs model size: the peak sits at the interpolation threshold, p ≈ n.</text><path d="M 80 320 L 600 320" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><path d="M 80 320 L 80 80" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><text x="340.0" y="344.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">number of features p (log scale)</text><text x="70.0" y="84.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">test MSE</text><path d="M 80.0 183.3 L 84.2 183.9 L 88.3 184.5 L 92.5 185.0 L 96.7 185.6 L 100.8 186.1 L 105.0 186.7 L 109.2 187.2 L 113.3 187.7 L 117.5 188.1 L 121.7 188.6 L 125.8 189.0 L 130.0 189.4 L 134.2 189.7 L 138.3 190.1 L 142.5 190.4 L 146.7 190.6 L 150.8 190.9 L 155.0 191.1 L 159.2 191.2 L 163.3 191.3 L 167.5 191.3 L 171.7 191.3 L 175.8 191.2 L 180.0 191.0 L 184.2 190.7 L 188.3 190.4 L 192.5 189.9 L 196.7 189.3 L 200.8 188.6 L 205.0 187.7 L 209.2 186.6 L 213.3 185.3 L 217.5 183.7 L 221.7 181.9 L 225.8 179.7 L 230.0 177.0 L 234.2 173.8 L 238.3 170.0 L 242.5 165.3 L 246.7 159.5 L 250.8 152.3 L 255.0 143.2 L 259.2 131.4 L 263.3 115.6 L 267.5 111.0 L 271.7 111.0 L 275.8 111.0 L 280.0 111.0 L 284.2 111.0 L 288.3 111.0 L 292.5 111.0 L 296.7 111.0 L 300.8 126.8 L 305.0 141.1 L 309.2 152.6 L 313.3 162.1 L 317.5 170.2 L 321.7 177.1 L 325.8 183.2 L 330.0 188.5 L 334.2 193.3 L 338.3 197.6 L 342.5 201.5 L 346.7 205.1 L 350.8 208.4 L 355.0 211.4 L 359.2 214.2 L 363.3 216.8 L 367.5 219.2 L 371.7 221.5 L 375.8 223.7 L 380.0 225.7 L 384.2 227.6 L 388.3 229.4 L 392.5 231.1 L 396.7 232.7 L 400.8 234.3 L 405.0 235.7 L 409.2 237.1 L 413.3 238.4 L 417.5 239.7 L 421.7 240.9 L 425.8 242.1 L 430.0 243.2 L 434.2 244.3 L 438.3 245.3 L 442.5 246.3 L 446.7 247.2 L 450.8 248.1 L 455.0 249.0 L 459.2 249.8 L 463.3 250.6 L 467.5 251.4 L 471.7 252.2 L 475.8 252.9 L 480.0 253.6 L 484.2 254.3 L 488.3 254.9 L 492.5 255.5 L 496.7 256.1 L 500.8 256.7 L 505.0 257.3 L 509.2 257.8 L 513.3 258.3 L 517.5 258.8 L 521.7 259.3 L 525.8 259.8 L 530.0 260.3 L 534.2 260.7 L 538.3 261.1 L 542.5 261.6 L 546.7 262.0 L 550.8 262.3 L 555.0 262.7 L 559.2 263.1 L 563.3 263.4 L 567.5 263.8 L 571.7 264.1 L 575.8 264.5 L 580.0 264.8" stroke="#0969da" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-accent"/><path d="M 80.0 196.8 L 88.3 200.7 L 96.7 204.3 L 105.0 207.8 L 113.3 211.2 L 121.7 214.3 L 130.0 217.3 L 138.3 220.2 L 146.7 222.9 L 155.0 225.5 L 163.3 228.0 L 171.7 230.3 L 180.0 232.5 L 188.3 234.7 L 196.7 236.7 L 205.0 238.6 L 213.3 240.4 L 221.7 242.1 L 230.0 243.8 L 238.3 245.4 L 246.7 246.9 L 255.0 248.3 L 263.3 249.6 L 271.7 250.9 L 280.0 252.1 L 288.3 253.3 L 296.7 254.4 L 305.0 255.5 L 313.3 256.5 L 321.7 257.4 L 330.0 258.3 L 338.3 259.2 L 346.7 260.0 L 355.0 260.8 L 363.3 261.5 L 371.7 262.2 L 380.0 262.9 L 388.3 263.5 L 396.7 264.2 L 405.0 264.7 L 413.3 265.3 L 421.7 265.8 L 430.0 266.3 L 438.3 266.8 L 446.7 267.2 L 455.0 267.7 L 463.3 268.1 L 471.7 268.4 L 480.0 268.8 L 488.3 269.2 L 496.7 269.5 L 505.0 269.8 L 513.3 270.1 L 521.7 270.4 L 530.0 270.7 L 538.3 270.9 L 546.7 271.2 L 555.0 271.4 L 563.3 271.6 L 571.7 271.9 L 580.0 272.1" stroke="#1a7f37" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-good"/><path d="M 280.0 320 L 280.0 90" stroke="#9a6700" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-warn"/><text x="280.0" y="82.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#9a6700" class="d-t-warn" text-anchor="middle">p = n (interpolation threshold)</text><text x="100.0" y="183.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">under-parameterised</text><text x="480.0" y="196.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="middle">over-parameterised:</text><text x="480.0" y="211.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="middle">min-norm fit gets smoother</text><text x="306.0" y="112.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">→ ~190, off the chart</text><text x="570.0" y="293.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="end">ridge: no peak</text><rect x="630.0" y="90.0" width="220.0" height="66.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="740.0" y="114.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Notebook (n = 100)</text><text x="740.0" y="132.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">test MSE: p=50 0.51 · p=100 ~190</text><text x="740.0" y="146.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">· p=3000 0.30</text><rect x="630.0" y="176.0" width="220.0" height="66.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="740.0" y="200.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Why the peak</text><text x="740.0" y="218.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">exactly determined, tiny</text><text x="740.0" y="232.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">singular values amplify noise</text><rect x="630.0" y="262.0" width="220.0" height="56.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="740.0" y="288.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">What removes it</text><text x="740.0" y="306.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">ridge, early stopping, more data</text><line x1="24.0" y1="346.0" x2="856.0" y2="346.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="24.0" y="370.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">Min-norm least squares: w = X⁺ y, the interpolating solution with the smallest ‖w‖.</text><text x="24.0" y="389.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">The peak comes from fitting noise exactly with a badly conditioned system, not from 'too many parameters'.</text></svg>

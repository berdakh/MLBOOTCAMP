<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img"><desc>The hashing trick. Four keys, each a field and value pair, go through a stable hash modulo n into a table of eight buckets. Including the field keeps C1=nike and C2=nike apart, but C1=adidas and C7=12345 land in the same bucket and share one weight: a collision. The expected collision rate is about one minus e to the minus k over n.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="440" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">The hashing trick</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">bucket = hash(field, value) mod n: no vocabulary, fixed memory, and some collisions.</text><rect x="30.0" y="90.0" width="150.0" height="44.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="105.0" y="116.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">C1 = nike</text><line x1="180.0" y1="112.0" x2="296.0" y2="177.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="30.0" y="150.0" width="150.0" height="44.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="105.0" y="176.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">C2 = nike</text><line x1="180.0" y1="172.0" x2="296.0" y2="187.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="30.0" y="210.0" width="150.0" height="44.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="105.0" y="236.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">C1 = adidas</text><line x1="180.0" y1="232.0" x2="296.0" y2="197.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="30.0" y="270.0" width="150.0" height="44.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="105.0" y="296.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">C7 = 12345</text><line x1="180.0" y1="292.0" x2="296.0" y2="207.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="300.0" y="160.0" width="180.0" height="76.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="390.0" y="189.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Stable hash</text><text x="390.0" y="207.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">MurmurHash / xxHash,</text><text x="390.0" y="221.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">field in the key</text><rect x="620.0" y="86.0" width="120.0" height="28.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="680.0" y="104.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bucket 0</text><rect x="620.0" y="120.0" width="120.0" height="28.0" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="680.0" y="138.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bucket 1</text><rect x="620.0" y="154.0" width="120.0" height="28.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="680.0" y="172.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bucket 2</text><rect x="620.0" y="188.0" width="120.0" height="28.0" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="680.0" y="206.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bucket 3</text><rect x="620.0" y="222.0" width="120.0" height="28.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="680.0" y="240.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bucket 4</text><rect x="620.0" y="256.0" width="120.0" height="28.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="680.0" y="274.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bucket 5</text><rect x="620.0" y="290.0" width="120.0" height="28.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="680.0" y="308.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bucket 6</text><rect x="620.0" y="324.0" width="120.0" height="28.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="680.0" y="342.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bucket 7</text><line x1="480.0" y1="186.0" x2="616.0" y2="134.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="480.0" y1="194.0" x2="616.0" y2="202.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="480.0" y1="202.0" x2="616.0" y2="270.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="480.0" y1="210.0" x2="616.0" y2="270.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><text x="752.0" y="260.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="start">collision:</text><text x="752.0" y="275.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="start">two keys share</text><text x="752.0" y="290.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="start">one weight</text><text x="105.0" y="336.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">C1 = nike ≠ C2 = nike</text><line x1="24.0" y1="370.0" x2="856.0" y2="370.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="24.0" y="394.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">P(a key collides) = 1 − (1 − 1/n)^(k−1) ≈ 1 − e^(−k/n)</text><text x="24.0" y="413.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">k = 425,677 keys into n = 2^19 = 524,288 buckets: 1 − e^(−0.81) ≈ 56% of keys share a bucket. Never use Python's salted hash().</text></svg>

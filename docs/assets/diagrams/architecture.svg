<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Project architecture"><title>Project architecture</title><style>
  .bg{fill:#ffffff} .box{fill:#f4f6fb;stroke:#3b4a6b;stroke-width:1.5}
  .accent{fill:#e3f0ff;stroke:#1f6feb;stroke-width:1.8} .warn{fill:#fff1e6;stroke:#c2410c;stroke-width:1.5}
  .ok{fill:#e8f7ee;stroke:#15803d;stroke-width:1.5} .muted{fill:#f8f8f8;stroke:#9aa3b2;stroke-width:1;stroke-dasharray:4 3}
  .t{font:600 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#1b2333}
  .s{font:12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#4a5568}
  .h{font:700 17px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#1b2333}
  .line{stroke:#3b4a6b;stroke-width:1.6;fill:none} .arrowhead{fill:#3b4a6b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0f1420} .box{fill:#1a2233;stroke:#8da2c9} .accent{fill:#132a4a;stroke:#58a6ff}
    .warn{fill:#3a2414;stroke:#f0883e} .ok{fill:#12301f;stroke:#3fb950} .muted{fill:#161b26;stroke:#5c667a}
    .t,.h{fill:#e6edf3} .s{fill:#a9b4c4} .line{stroke:#8da2c9} .arrowhead{fill:#8da2c9}
  }
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1000" height="330" rx="10"/><text class="h" x="500" y="32" text-anchor="middle">The running project, end to end</text><rect class="box" x="20" y="60" width="140" height="80" rx="8"/><text class="t" x="90.0" y="86.0" text-anchor="middle">Raw extract</text><text class="s" x="90.0" y="104.0" text-anchor="middle">4 tables, CSV.gz</text><text class="s" x="90.0" y="119.0" text-anchor="middle">SHA-256 verified</text><path class="line" d="M160,100 L181,100" marker-end="url(#ah)"/><rect class="box" x="183" y="60" width="140" height="80" rx="8"/><text class="t" x="253.0" y="86.0" text-anchor="middle">Validate</text><text class="s" x="253.0" y="104.0" text-anchor="middle">contracts</text><text class="s" x="253.0" y="119.0" text-anchor="middle">+ cleaning</text><path class="line" d="M323,100 L344,100" marker-end="url(#ah)"/><rect class="accent" x="346" y="60" width="140" height="80" rx="8"/><text class="t" x="416.0" y="86.0" text-anchor="middle">SQL features</text><text class="s" x="416.0" y="104.0" text-anchor="middle">point-in-time</text><text class="s" x="416.0" y="119.0" text-anchor="middle">DuckDB</text><path class="line" d="M486,100 L507,100" marker-end="url(#ah)"/><rect class="box" x="509" y="60" width="140" height="80" rx="8"/><text class="t" x="579.0" y="86.0" text-anchor="middle">Split</text><text class="s" x="579.0" y="104.0" text-anchor="middle">time-based</text><text class="s" x="579.0" y="119.0" text-anchor="middle">+ embargo</text><path class="line" d="M649,100 L670,100" marker-end="url(#ah)"/><rect class="box" x="672" y="60" width="140" height="80" rx="8"/><text class="t" x="742.0" y="86.0" text-anchor="middle">Pipeline</text><text class="s" x="742.0" y="104.0" text-anchor="middle">preprocess</text><text class="s" x="742.0" y="119.0" text-anchor="middle">+ model</text><path class="line" d="M812,100 L833,100" marker-end="url(#ah)"/><rect class="accent" x="835" y="60" width="140" height="80" rx="8"/><text class="t" x="905.0" y="86.0" text-anchor="middle">Registry</text><text class="s" x="905.0" y="104.0" text-anchor="middle">v1 v2 v3</text><text class="s" x="905.0" y="119.0" text-anchor="middle">CURRENT</text><rect class="ok" x="670" y="210" width="150" height="80" rx="8"/><text class="t" x="745.0" y="236.0" text-anchor="middle">FastAPI service</text><text class="s" x="745.0" y="254.0" text-anchor="middle">/predict /ready</text><text class="s" x="745.0" y="269.0" text-anchor="middle">/metrics</text><rect class="warn" x="860" y="210" width="120" height="80" rx="8"/><text class="t" x="920.0" y="236.0" text-anchor="middle">Monitoring</text><text class="s" x="920.0" y="254.0" text-anchor="middle">drift · latency</text><text class="s" x="920.0" y="269.0" text-anchor="middle">labels later</text><rect class="box" x="470" y="210" width="160" height="80" rx="8"/><text class="t" x="550.0" y="236.0" text-anchor="middle">Client</text><text class="s" x="550.0" y="254.0" text-anchor="middle">timeouts · retries</text><text class="s" x="550.0" y="269.0" text-anchor="middle">request ids</text><path class="line" d="M910,140 L760,208" marker-end="url(#ah)"/><text class="s" x="850" y="170" text-anchor="start">loads CURRENT</text><text class="s" x="850" y="186" text-anchor="start">(rollback = move the pointer)</text><path class="line" d="M630,250 L668,250" marker-end="url(#ah)"/><path class="line" d="M820,250 L858,250" marker-end="url(#ah)"/><rect class="muted" x="20" y="210" width="400" height="80" rx="8"/><text class="t" x="220.0" y="243.0" text-anchor="middle">Days 1-2: data → model</text><text class="s" x="220.0" y="261.0" text-anchor="middle">Days 3-4: model → service → operations</text></svg>

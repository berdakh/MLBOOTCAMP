<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img"><desc>Expected value against threshold: negative when too many low-probability accounts are called, a broad maximum near the break-even probability 1/6, and falling towards zero when too few are called.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="360" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Choosing a threshold from costs</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Expected value of calling everyone above t, with VALUE_TP = $150 and COST_FP = $30.</text><line x1="90.0" y1="290.0" x2="610.0" y2="290.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><line x1="90.0" y1="80.0" x2="90.0" y2="290.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="350.0" y="312.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">threshold t</text><text x="64.0" y="185.0" font-family="sans-serif" font-size="11.5" fill="#656d76" text-anchor="middle" transform="rotate(-90 64.0 185.0)">expected value ($)</text><path d="M 90.0 220.0 L 610.0 220.0" stroke="#d0d7de" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-stroke"/><text x="82.0" y="224.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">0</text><path d="M 133.3 276.9 L 137.7 259.8 L 142.0 244.8 L 146.3 231.6 L 150.7 220.0 L 155.0 209.9 L 159.3 201.1 L 163.7 193.5 L 168.0 186.8 L 172.3 181.1 L 176.7 176.3 L 181.0 172.1 L 185.3 168.6 L 189.7 165.6 L 194.0 163.1 L 198.3 161.1 L 202.7 159.5 L 207.0 158.2 L 211.3 157.3 L 215.7 156.6 L 220.0 156.1 L 224.3 155.9 L 228.7 155.8 L 233.0 155.9 L 237.3 156.1 L 241.7 156.5 L 246.0 157.0 L 250.3 157.5 L 254.7 158.1 L 259.0 158.8 L 263.3 159.6 L 267.7 160.4 L 272.0 161.2 L 276.3 162.1 L 280.7 163.0 L 285.0 163.9 L 289.3 164.9 L 293.7 165.8 L 298.0 166.8 L 302.3 167.7 L 306.7 168.7 L 311.0 169.7 L 315.3 170.6 L 319.7 171.6 L 324.0 172.5 L 328.3 173.5 L 332.7 174.4 L 337.0 175.3 L 341.3 176.3 L 345.7 177.2 L 350.0 178.1 L 354.3 178.9 L 358.7 179.8 L 363.0 180.6 L 367.3 181.5 L 371.7 182.3 L 376.0 183.1 L 380.3 183.9 L 384.7 184.7 L 389.0 185.4 L 393.3 186.2 L 397.7 186.9 L 402.0 187.6 L 406.3 188.3 L 410.7 189.0 L 415.0 189.7 L 419.3 190.4 L 423.7 191.0 L 428.0 191.7 L 432.3 192.3 L 436.7 192.9 L 441.0 193.5 L 445.3 194.1 L 449.7 194.6 L 454.0 195.2 L 458.3 195.8 L 462.7 196.3 L 467.0 196.8 L 471.3 197.3 L 475.7 197.8 L 480.0 198.3 L 484.3 198.8 L 488.7 199.3 L 493.0 199.7 L 497.3 200.2 L 501.7 200.6 L 506.0 201.0 L 510.3 201.5 L 514.7 201.9 L 519.0 202.3 L 523.3 202.7 L 527.7 203.1 L 532.0 203.4 L 536.3 203.8 L 540.7 204.2 L 545.0 204.5 L 549.3 204.9 L 553.7 205.2 L 558.0 205.5 L 562.3 205.8 L 566.7 206.2 L 571.0 206.5 L 575.3 206.8 L 579.7 207.1 L 584.0 207.4 L 588.3 207.6 L 592.7 207.9 L 597.0 208.2 L 601.3 208.4 L 605.7 208.7 L 610.0 209.0" stroke="#0969da" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-accent"/><path d="M 234.4 80 L 234.4 290" stroke="#1a7f37" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-good"/><text x="234.4" y="74.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="middle">p* = 30 / (150 + 30) = 1/6</text><text x="248.4" y="250.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="start">← left of p*: too many calls,</text><text x="248.4" y="266.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="start">each wasted one costs $30</text><text x="600.0" y="140.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#9a6700" class="d-t-warn" text-anchor="end">far right: too few calls,</text><text x="600.0" y="156.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#9a6700" class="d-t-warn" text-anchor="end">churners left on the table</text><rect x="650.0" y="90.0" width="200.0" height="120.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="750.0" y="141.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Call when p &gt; 1/6</text><text x="750.0" y="159.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">p · 150 &gt; (1 − p) · 30. Valid</text><text x="750.0" y="173.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">only for calibrated p.</text><text x="650.0" y="240.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Only the ratio cost/value</text><text x="650.0" y="258.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">sets p*; the flat top means</text><text x="650.0" y="276.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">0.17 vs 0.19 is noise.</text></svg>

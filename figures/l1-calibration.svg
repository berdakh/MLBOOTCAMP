<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img"><desc>Reliability diagram: a calibrated logistic regression follows the diagonal, while a class-weighted model sits far below it, predicting several times the true churn rate, with almost the same ranking quality.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="360" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Reading a reliability diagram</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Bin by predicted score; compare the mean score with the observed churn rate.</text><line x1="90.0" y1="310.0" x2="330.0" y2="310.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><line x1="90.0" y1="70.0" x2="90.0" y2="310.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="210.0" y="332.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">mean predicted probability</text><text x="64.0" y="190.0" font-family="sans-serif" font-size="11.5" fill="#656d76" text-anchor="middle" transform="rotate(-90 64.0 190.0)">observed churn rate</text><path d="M 90.0 310.0 L 330.0 70.0" stroke="#656d76" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-muted_fg"/><path d="M 94.8 305.2 L 109.2 293.2 L 126.0 271.6 L 150.0 252.4 L 181.2 214.0 L 222.0 182.8" stroke="#1a7f37" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-good"/><circle cx="94.8" cy="305.2" r="3.5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><circle cx="109.2" cy="293.2" r="3.5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><circle cx="126.0" cy="271.6" r="3.5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><circle cx="150.0" cy="252.4" r="3.5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><circle cx="181.2" cy="214.0" r="3.5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><circle cx="222.0" cy="182.8" r="3.5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><path d="M 114.0 307.6 L 150.0 302.8 L 186.0 298.0 L 229.2 288.4 L 270.0 274.0 L 306.0 257.2" stroke="#cf222e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-bad"/><circle cx="114.0" cy="307.6" r="3.5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><circle cx="150.0" cy="302.8" r="3.5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><circle cx="186.0" cy="298.0" r="3.5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><circle cx="229.2" cy="288.4" r="3.5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><circle cx="270.0" cy="274.0" r="3.5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><circle cx="306.0" cy="257.2" r="3.5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="240.0" y="140.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">perfect</text><rect x="380.0" y="80.0" width="220.0" height="64.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="490.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Plain logreg</text><text x="490.0" y="128.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">on the diagonal · Brier ≈ 0.047</text><rect x="380.0" y="160.0" width="220.0" height="64.0" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="490.0" y="190.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">class_weight=balanced</text><text x="490.0" y="208.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">far below it · Brier ≈ 0.19</text><rect x="630.0" y="80.0" width="220.0" height="144.0" rx="9" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="740.0" y="136.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Same ranking</text><text x="740.0" y="154.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">PR-AUC 0.163 vs 0.161.</text><text x="740.0" y="168.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Re-weighting moved the</text><text x="740.0" y="182.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">probabilities, not the order.</text><text x="380.0" y="270.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Below the diagonal = over-confident. A monotone recalibration (sigmoid) fixes the</text><text x="380.0" y="288.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">probabilities and leaves PR-AUC unchanged. Fit it on later rows, never validation.</text></svg>

dasharray="5 4" class="d-ghost"/><text x="98.0" y="273.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">i4</text><rect x="110.0" y="248.0" width="42.0" height="42.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><rect x="156.0" y="248.0" width="42.0" height="42.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><rect x="202.0" y="248.0" width="42.0" height="42.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="248.0" y="248.0" width="42.0" height="42.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="294.0" y="248.0" width="42.0" height="42.0" rx="4" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="340.0" y="248.0" width="42.0" height="42.0" rx="4" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="98.0" y="319.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">i9</text><rect x="110.0" y="294.0" width="42.0" height="42.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><rect x="156.0" y="294.0" width="42.0" height="42.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><rect x="202.0" y="294.0" width="42.0" height="42.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="248.0" y="294.0" width="42.0" height="42.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="294.0" y="294.0" width="42.0" height="42.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="340.0" y="294.0" width="42.0" height="42.0" rx="4" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="98.0" y="365.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">i2</text><rect x="110.0" y="340.0" width="42.0" height="42.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><rect x="156.0" y="340.0" width="42.0" height="42.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><rect x="202.0" y="340.0" width="42.0" height="42.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="248.0" y="340.0" width="42.0" height="42.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="294.0" y="340.0" width="42.0" height="42.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><rect x="340.0" y="340.0" width="42.0" height="42.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="248.0" y="404.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">key j →</text><rect x="440.0" y="100.0" width="30.0" height="30.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="484.0" y="113.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">may attend</text><text x="484.0" y="130.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">j ≤ i and key is a real item</text><rect x="440.0" y="164.0" width="30.0" height="30.0" rx="4" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="484.0" y="177.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">causal block</text><text x="484.0" y="194.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">j &gt; i: no peeking at the future</text><rect x="440.0" y="228.0" width="30.0" height="30.0" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="484.0" y="241.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">padding block</text><text x="484.0" y="258.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">key is PAD</text><rect x="440.0" y="292.0" width="30.0" height="30.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="484.0" y="305.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">unblocked diagonal</text><text x="484.0" y="322.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">a PAD row would be all −∞ → NaN</text><rect x="440.0" y="360.0" width="416.0" height="30.0" rx="9" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="648.0" y="379.2" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">softmax(QKᵀ/√d + M) V, M = −∞ where blocked</text><rect x="24.0" y="420.0" width="832.0" height="40.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="440.0" y="445.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Test the mask: changing future items must not change earlier outputs.</text></svg>

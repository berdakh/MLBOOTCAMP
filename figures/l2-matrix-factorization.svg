<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img"><desc>A sparse 6 by 8 user-item click matrix approximated by a 6 by 2 user factor matrix times a 2 by 8 item factor matrix. The score of a user-item pair is the dot product of their vectors. ALS alternates between solving for the user vectors and the item vectors in closed form.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="360" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Matrix factorisation for implicit feedback</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">A sparse click matrix approximated by user vectors times item vectors.</text><rect x="40.0" y="104.0" width="23.0" height="23.0" rx="3" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="66.0" y="104.0" width="23.0" height="23.0" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><rect x="92.0" y="104.0" width="23.0" height="23.0" rx="3" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="118.0" y="104.0" width="23.0" height="23.0" rx="3" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="144.0" y="104.0" width="23.0" he
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img"><desc>A pre-LayerNorm decoder block read left to right: x goes through LayerNorm and causal multi-head attention and is added back to x; the result goes through LayerNorm and an MLP and is added back again. Two residual skip paths run above the row.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="920" height="360" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">One pre-LayerNorm decoder block</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Normalise inside each branch; the residual stream passes straight through.</text><rect x="24.0" y="170.0" width="92.0" height="52.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="70.0" y="187.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">x</text><text x="70.0" y="205.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">residual</text><text x="70.0" y="219.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">stream</text><line x1="116.0" y1="196.0" x2="146.0" y2="196.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="150.0" y="170.0" width="80.0" height="52.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="190.0" y="200.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">LayerNorm</text><line x1="230.0" y1="196.0" x2="256.0" y2="196.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="260.0" y="170.0" width="150.0" height="52.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="335.0" y="194.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Attention</text><text x="335.0" y="212.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">causal, H heads</text><line x1="410.0" y1="196.0" x2="424.0" y2="196.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><circle cx="440.0" cy="196.0" r="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="440.0" y="201.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">+</text><line x1="454.0" y1="196.0" x2="476.0" y2="196.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="480.0" y="170.0" width="80.0" height="52.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="520.0" y="200.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">LayerNorm</text><line x1="560.0" y1="196.0" x2="586.0" y2="196.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="590.0" y="170.0" width="150.0" height="52.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="665.0" y="194.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">MLP</text><text x="665.0" y="212.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">C → 4C → C, GELU</text><line x1="740.0" y1="196.0" x2="754.0" y2="196.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><circle cx="770.0" cy="196.0" r="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="770.0" y="201.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">+</text><line x1="784.0" y1="196.0" x2="806.0" y2="196.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="810.0" y="170.0" width="86.0" height="52.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="853.0" y="187.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">out</text><text x="853.0" y="205.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">to next</text><text x="853.0" y="219.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">block</text><path d="M 133 196.0 L 133 116 L 440 116 L 440 180.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><path d="M 466 196.0 L 466 116 L 770 116 L 770 180.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><text x="286.0" y="108.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">residual: h = x + Attn(LN(x))</text><text x="618.0" y="108.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">residual: out = h + MLP(LN(h))</text><text x="460.0" y="260.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">Stack N blocks, then a final LayerNorm and a Linear to the vocabulary (weight-tied to the token embedding).</text><rect x="24.0" y="300.0" width="872.0" height="40.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="460.0" y="325.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Pre-LN keeps a clean identity path from output to input, so deep stacks train stably.</text></svg>

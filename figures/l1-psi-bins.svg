<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img"><desc>Reference and current shares in five quintile bins; each bin contributes (a - e) ln(a / e), and the terms sum to a PSI of 0.135, a moderate shift.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="380" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Population Stability Index, bin by bin</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Reference cut into quintiles (20% each); this month's share in each bin.</text><rect x="70.0" y="150.0" width="36.0" height="100.0" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="110.0" y="100.0" width="36.0" height="150.0" rx="2" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="108.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bin 1</text><text x="108.0" y="288.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">0.041</text><rect x="180.0" y="150.0" width="36.0" height="100.0" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="220.0" y="125.0" width="36.0" height="125.0" rx="2" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="218.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bin 2</text><text x="218.0" y="288.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">0.011</text><rect x="290.0" y="150.0" width="36.0" height="100.0" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="330.0" y="150.0" width="36.0" height="100.0" rx="2" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="328.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bin 3</text><text x="328.0" y="288.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">0.000</text><rect x="400.0" y="150.0" width="36.0" height="100.0" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="440.0" y="175.0" width="36.0" height="75.0" rx="2" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="438.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bin 4</text><text x="438.0" y="288.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">0.014</text><rect x="510.0" y="150.0" width="36.0" height="100.0" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="550.0" y="200.0" width="36.0" height="50.0" rx="2" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="548.0" y="268.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">bin 5</text><text x="548.0" y="288.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">0.069</text><line x1="60.0" y1="250.0" x2="610.0" y2="250.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="30.0" y="288.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">term</text><rect x="70.0" y="300.0" width="14.0" height="14.0" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="90.0" y="312.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">reference e</text><rect x="190.0" y="300.0" width="14.0" height="14.0" rx="2" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="210.0" y="312.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">current a</text><rect x="640.0" y="80.0" width="210.0" height="72.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="745.0" y="114.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">PSI = Σ (a − e) ln(a / e)</text><text x="745.0" y="132.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">every term ≥ 0</text><rect x="640.0" y="166.0" width="210.0" height="50.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="745.0" y="189.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">PSI = 0.135</text><text x="745.0" y="207.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">moderate shift</text><rect x="640.0" y="230.0" width="210.0" height="28.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="745.0" y="248.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">&lt; 0.1 stable</text><rect x="640.0" y="264.0" width="210.0" height="28.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="745.0" y="282.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">0.1-0.25 moderate</text><rect x="640.0" y="298.0" width="210.0" height="28.0" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="745.0" y="316.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">&gt; 0.25 large</text><text x="30.0" y="360.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Bands are conventions, not laws; a calendar artifact can score above 3 while nothing is wrong.</text></svg>

l, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">positives</text><rect x="600.0" y="238.0" width="250.0" height="62.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="725.0" y="267.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">BNSP AUC: BN vs SP</text><text x="725.0" y="285.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">low → toxic posts about g are missed</text><line x1="24.0" y1="344.0" x2="856.0" y2="344.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="24.0" y="368.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">AUC(A vs B) = P(score of a random positive in A &gt; score of a random negative in B)</text><text x="24.0" y="387.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Notebook signature for 'black', 'muslim', 'gay': BPSN 0.67–0.75 but BNSP 0.91–0.95: benign mentions score like toxicity.</text><text x="24.0" y="412.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">No threshold is involved: these AUCs show where the ranking fails before you pick an operating point.</text></svg>

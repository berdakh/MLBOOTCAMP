<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img"><desc>Score distributions on two rows. Background comments: non-toxic BN on the left, toxic BP on the right. Subgroup comments: non-toxic SN shifted towards higher scores by the identity term, and toxic SP. Subgroup AUC compares SN with SP, BPSN compares BP with SN and is low when SN is shifted up, and BNSP compares BN with SP and is low when toxic posts about the group are missed.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="440" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Subgroup AUC, BPSN and BNSP</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Score distributions of toxic (+) and non-toxic (−) comments, with and without an identity mention.</text><line x1="120.0" y1="170.0" x2="560.0" y2="170.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="108.0" y="150.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="end">Background</text><line x1="120.0" y1="290.0" x2="560.0" y2="290.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="108.0" y="270.0" font-family='-apple-system, BlinkM
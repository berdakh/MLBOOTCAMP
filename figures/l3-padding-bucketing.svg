<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"><desc>Three panels of the same six texts in two batches of three. Padding every row to 128 tokens wastes 52 percent of positions; dynamic padding to the longest row in each batch wastes 41 percent; sorting by length first so similar lengths share a batch wastes 25 percent.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="400" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Padding waste and length bucketing</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Every pad token costs as much compute as a real one. Same 6 texts, three batchings.</text><text x="24.0" y="92.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">pad to max (128)</text><rect x="24.0" y="106.0" width="198.4" height="14.0" rx="3" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="24.0" y="106.0" width="46.5" height="14.0" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><rect x="24.0" y="125.0" width="198.4" height="14.0" rx="3" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="24.0" y="125.0" width="186.0" height="14.0" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><rect x="24.0" y="144.0" width="198.4" height="14.0" rx="3" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="24.0" y="144.0" width="69.8" height="14.0" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="228.4" y="141.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">batch 1</text><rect x="24.0" y="177.0" width="198.4" height="14.0" rx="3" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="24.0" y="177.0" width="93.0" height="14.0" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><rect x="24.0" y="196.0" width="198.4" height="14.0" rx="3" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="24.0" y="196.0" width="38.8" height="14.0" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><rect x="24.0" y="215.0" width="198.4" height="14.0" rx="3" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><rect x="24.0" y="215.0" width="139.5" height="14.0" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="228.4" y="212.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">batch 2</text><text x="24.0" y="262.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#cf222e" class="d-t-bad" text-anchor="start">waste 52%</text><text x="314.0" y="
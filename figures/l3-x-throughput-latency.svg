oto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#9a6700" class="d-t-warn" text-anchor="end">SLO: p95 ≤ 60 ms</text><text x="362.0" y="100.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">no batching</text><text x="468.0" y="100.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="start">dynamic batching</text><circle cx="345.8" cy="240.0" r="5" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="345.8" y="322.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">208</text><circle cx="413.9" cy="240.0" r="5" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="413.9" y="322.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">261</text><rect x="600.0" y="90.0" width="250.0" height="70.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="725.0" y="123.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Little's law: L = λ · W</text><text x="725.0" y="141.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">in flight = arrival rate × time</text><rect x="600.0" y="180.0" width="250.0" height="70.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="725.0" y="213.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">300 req/s × 0.05 s = 15</text><text x="725.0" y="231.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">requests in flight at once</text><rect x="600.0" y="270.0" width="250.0" height="60.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="725.0" y="298.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Capacity = load at the SLO</text><text x="725.0" y="316.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">the marked points, not the peak</text><line x1="24.0" y1="360.0" x2="856.0" y2="360.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="24.0" y="384.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="start">Batching moves the curve right: more requests per second at the same latency.</text><text x="24.0" y="403.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Plan capacity at the highest load whose p95 (or p99) still meets the SLO, then add headroom.</text></svg>

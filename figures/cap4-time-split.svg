<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img"><desc>Three splits on a time axis for two users. Random holdout: user A's held-out rating has later ratings of A in training. Leave-last-out: A's last positive is the test target, but user B's ratings after A's test time are in training. Global split at time T: everything before T is training, A's first positive after T is the target, nothing after T is used.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="430" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Three ways to hold out a rating, and what each one leaks</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Two users, A and B, on the same time axis. Circles are ratings; the test circle is the held-out positive.</text><circle cx="250.0" cy="80.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="264.0" y="84.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">used for training</text><circle cx="410.0" cy="80.0" r="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="424.0" y="84.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">test target</text><circle cx="570.0" cy="80.0" r="7" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="584.0" y="84.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">future seen in training</text><circle cx="730.0" cy="80.0" r="7" fill="none" stroke="#d0d7de" stroke-width="1.6" class="d-ghost"/><text x="744.0" y="84.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">not used</text><rect x="24.0" y="126.0" width="180.0" height="58.0" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="114.0" y="146.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Random holdout</text><text x="114.0" y="164.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">leaks the user's own</text><text x="114.0" y="178.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">future</text><text x="222.0" y="143.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">A</text><text x="222.0" y="175.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">B</text><line x1="230.0" y1="139.0" x2="850.0" y2="139.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><circle cx="260.0" cy="139.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="320.0" cy="139.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="380.0" cy="139.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="440.0" cy="139.0" r="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><circle cx="500.0" cy="139.0" r="7" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><circle cx="560.0" cy="139.0" r="7" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><circle cx="620.0" cy="139.0" r="7" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><circle cx="680.0" cy="139.0" r="7" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><line x1="230.0" y1="171.0" x2="850.0" y2="171.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><circle cx="300.0" cy="171.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="400.0" cy="171.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="480.0" cy="171.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="560.0" cy="171.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="660.0" cy="171.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="760.0" cy="171.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><rect x="24.0" y="206.0" width="180.0" height="58.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="114.0" y="233.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Leave-last-out</text><text x="114.0" y="251.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">leaks other users' future</text><text x="222.0" y="223.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">A</text><text x="222.0" y="255.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">B</text><line x1="230.0" y1="219.0" x2="850.0" y2="219.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><circle cx="260.0" cy="219.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="320.0" cy="219.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="380.0" cy="219.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="440.0" cy="219.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="500.0" cy="219.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="560.0" cy="219.0" r="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><circle cx="620.0" cy="219.0" r="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><circle cx="700.0" cy="219.0" r="7" fill="none" stroke="#d0d7de" stroke-width="1.6" class="d-ghost"/><line x1="230.0" y1="251.0" x2="850.0" y2="251.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><circle cx="300.0" cy="251.0" r="7" fill="#ddf4f
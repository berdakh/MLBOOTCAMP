<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img"><desc>Wrong: preprocessing written once in a notebook and again in the service, with one step forgotten, gives different scores from the same coefficients. Right: one fitted pipeline is saved and served.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="360" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Training/serving skew</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Two implementations of "the same" preprocessing are two different models.</text><text x="30.0" y="80.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#cf222e" class="d-t-bad" text-anchor="start">Wrong: preprocessing written twice</text><rect x="30.0" y="90.0" width="170.0" height="46.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="115.0" y="117.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">training rows</text><rect x="240.0" y="90.0" width="220.0" height="46.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="350.0" y="111.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">notebook transform</text><text x="350.0" y="129.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">log1p · medians · scaling</text><rect x="30.0" y="146.0" width="170.0" height="46.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="115.0" y="173.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">API request</text><rect x="240.0" y="146.0" width="220.0" height="46.0" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="350.0" y="167.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">rewritten in service</text><text x="350.0" y="185.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">one step forgotten</text><rect x="500.0" y="90.0" width="150.0" height="102.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="575.0" y="146.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">same coefficients</text><rect x="690.0" y="90.0" width="160.0" height="102.0" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6" class="d-bad"/><text x="770.0" y="139.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">different scores</text><text x="770.0" y="157.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">validated ≠ served</text><line x1="202.0" y1="113.0" x2="236.0" y2="113.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="202.0" y1="169.0" x2="236.0" y2="169.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="462.0" y1="113.0" x2="496.0" y2="125.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="462.0" y1="169.0" x2="496.0" y2="157.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><line x1="652.0" y1="141.0" x2="686.0" y2="141.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><text x="30.0" y="236.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#1a7f37" class="d-t-good" text-anchor="start">Right: one fitted object, trained and served</text><rect x="30.0" y="246.0" width="180.0" height="46.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="120.0" y="274.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">train rows</text><rect x="240.0" y="246.0" width="180.0" height="46.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="330.0" y="274.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Pipeline.fit</text><rect x="450.0" y="246.0" width="180.0" height="46.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="540.0" y="274.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">bundle</text><rect x="660.0" y="246.0" width="180.0" height="46.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="750.0" y="274.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">service loads it</text><line x1="212.0" y1="269.0" x2="236.0" y2="269.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="422.0" y1="269.0" x2="446.0" y2="269.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="632.0" y1="269.0" x2="656.0" y2="269.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><text x="30.0" y="334.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Guard it with a parity test: offline predict_proba and the running API must agree on the same rows.</text></svg>

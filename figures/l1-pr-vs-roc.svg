<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img"><desc>Two plots of the same model: the ROC curve with the random diagonal at 0.5, and the precision-recall curve whose random baseline is the positive rate, 0.05.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="360" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">ROC and PR curves at a 5% positive rate</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Same model, two views. Only one has a baseline that moves with the positive rate.</text><line x1="80.0" y1="280.0" x2="380.0" y2="280.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><line x1="80.0" y1="80.0" x2="80.0" y2="280.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="230.0" y="302.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">false positive rate</text><text x="54.0" y="180.0" font-family="sans-serif" font-size="11.5" fill="#656d76" text-anchor="middle" transform="rotate(-90 54.0 180.0)">true positive rate</text><path d="M 80.0 280.0 L 380.0 80.0" stroke="#656d76" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-muted_fg"/><path d="M 80.0 280.0 L 87.5 267.3 L 95.0 255.0 L 102.5 243.3 L 110.0 232.1 L 117.5 221.3 L 125.0 211.1 L 132.5 201.3 L 140.0 192.0 L 147.5 183.1 L 155.0 174.7 L 162.5 166.7 L 170.0 159.1 L 177.5 152.0 L 185.0 145.3 L 192.5 138.9 L 200.0 133.0 L 207.5 127.4 L 215.0 122.3 L 222.5 117.4 L 230.0 113.0 L 237.5 108.9 L 245.0 105.1 L 252.5 101.6 L 260.0 98.5 L 267.5 95.6 L 275.0 93.0 L 282.5 90.8 L 290.0 88.7 L 297.5 87.0 L 305.0 85.4 L 312.5 84.1 L 320.0 83.0 L 327.5 82.2 L 335.0 81.4 L 342.5 80.9 L 350.0 80.5 L 357.5 80.2 L 365.0 80.1 L 372.5 80.0 L 380.0 80.0" stroke="#0969da" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-accent"/><text x="280.0" y="230.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">random = 0.5</text><text x="150.0" y="96.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="middle">ROC-AUC ≈ 0.73</text><line x1="520.0" y1="280.0" x2="820.0" y2="280.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><line x1="520.0" y1="80.0" x2="520.0" y2="280.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="670.0" y="302.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">recall</text><text x="494.0" y="180.0" font-family="sans-serif" font-size="11.5" fill="#656d76" text-anchor="middle" transform="rotate(-90 494.0 180.0)">precision</text><path d="M 520.0 270.0 L 820.0 270.0" stroke="#656d76" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" class="d-s-muted_fg"/><path d="M 523.0 182.7 L 530.4 189.0 L 537.9 194.9 L 545.3 200.5 L 552.7 205.7 L 560.1 210.6 L 567.5 215.2 L 575.0 219.5 L 582.4 223.6 L 589.8 227.3 L 597.2 230.9 L 604.7 234.2 L 612.1 237.2 L 619.5 240.1 L 627.0 242.8 L 634.4 245.3 L 641.8 247.6 L 649.2 249.7 L 656.6 251.7 L 664.1 253.6 L 671.5 255.3 L 678.9 256.9 L 686.4 258.4 L 693.8 259.7 L 701.2 260.9 L 708.6 262.1 L 716.0 263.1 L 723.5 264.1 L 730.9 264.9 L 738.3 265.7 L 745.8 266.4 L 753.2 267.1 L 760.6 267.6 L 768.0 268.1 L 775.5 268.6 L 782.9 268.9 L 790.3 269.3 L 797.7 269.5 L 805.1 269.8 L 812.6 269.9 L 820.0 270.0" stroke="#0969da" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="d-s-accent"/><text x="580.0" y="262.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">random = 0.05</text><text x="710.0" y="140.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="middle">PR-AUC ≈ 0.16</text><text x="30.0" y="334.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">ROC is flattered by thousands of easy negatives; PR shows the top of the ranking, where the calls are made.</text></svg>

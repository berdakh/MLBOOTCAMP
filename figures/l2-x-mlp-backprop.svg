<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" role="img"><desc>Top row, the forward pass of a two-layer MLP: X, linear, ReLU, linear, softmax cross-entropy. Bottom row, the backward pass in reverse: dz2 = (P - Y)/n, dh = dz2 W2 transposed, dz1 = dh masked by z1 &gt; 0, dW1 = X transposed dz1.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="384" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Backprop through a two-layer MLP</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Forward: keep every intermediate. Backward: the same graph in reverse, one local rule per box.</text><text x="24.0" y="84.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="start">forward →</text><text x="24.0" y="220.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#9a6700" class="d-t-warn" text-anchor="start">← backward (chain rule)</text><rect x="22.0" y="92.0" width="156.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="100.0" y="118.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">X</text><text x="100.0" y="136.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">(n, d)</text><rect x="22.0" y="228.0" width="156.0" height="74.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="100.0" y="256.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">dW₁ = Xᵀ dz₁</text><text x="100.0" y="274.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">db₁ = Σ dz₁ · shape of</text><text x="100.0" y="288.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">W₁</text><line x1="100.0" y1="150.0" x2="100.0" y2="200.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><rect x="192.0" y="92.0" width="156.0" height="56.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="270.0" y="118.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">z₁ = XW₁ + b₁</text><text x="270.0" y="136.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">(n, h)</text><rect x="192.0" y="228.0" width="156.0" height="74.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="270.0" y="263.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">dz₁ = dh·[z₁&gt;0]</text><text x="270.0" y="281.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">ReLU passes or blocks</text><line x1="270.0" y1="150.0" x2="270.0" y2="200.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="179.0" y1="120.0" x2="189.0" y2="120.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="190.0" y1="265.0" x2="180.0" y2="265.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><rect x="362.0" y="92.0" width="156.0" height="56.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="440.0" y="118.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">h = relu(z₁)</text><text x="440.0" y="136.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">(n, h)</text><rect x="362.0" y="228.0" width="156.0" height="74.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="440.0" y="263.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">dh = dz₂ W₂ᵀ</text><text x="440.0" y="281.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">(n,C)(C,h) → (n,h)</text><line x1="440.0" y1="150.0" x2="440.0" y2="200.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="349.0" y1="120.0" x2="359.0" y2="120.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="360.0" y1="265.0" x2="350.0" y2="265.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><rect x="532.0" y="92.0" width="156.0" height="56.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="610.0" y="118.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">z₂ = hW₂ + b₂</text><text x="610.0" y="136.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">logits (n, C)</text><rect x="532.0" y="228.0" width="156.0" height="74.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="610.0" y="256.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">dz₂ = (P − Y) / n</text><text x="610.0" y="274.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">dW₂ = hᵀ dz₂, db₂ = Σ</text><text x="610.0" y="288.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">dz₂</text><line x1="610.0" y1="150.0" x2="610.0" y2="200.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="519.0" y1="120.0" x2="529.0" y2="120.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="530.0" y1="265.0" x2="520.0" y2="265.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><rect x="702.0" y="92.0" width="156.0" height="56.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="780.0" y="118.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">L = CE(P, y)</text><text x="780.0" y="136.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">P = softmax(z₂); mean</text><rect x="702.0" y="228.0" width="156.0" height="74.0" rx="9" fill="none" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-ghost"/><text x="780.0" y="263.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">dL = 1</text><text x="780.0" y="281.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">start here</text><line x1="780.0" y1="150.0" x2="780.0" y2="200.0" stroke="#656d76" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="689.0" y1="120.0" x2="699.0" y2="120.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><line x1="700.0" y1="265.0" x2="690.0" y2="265.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><rect x="24.0" y="320.0" width="832.0" height="44.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="440.0" y="347.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Every gradient has the shape of its variable: dW₁ is d × h like W₁, so the matrix product is forced.</text></svg>

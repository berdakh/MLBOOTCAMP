<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img"><desc>A similarity matrix with four query rows and seven document columns: four batch documents whose diagonal entries are the positives and off-diagonal entries are in-batch negatives, plus three hard-negative columns mined with BM25. Logits are dot products of unit vectors divided by a temperature of 0.05, and the loss is cross-entropy with the diagonal as target.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="420" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Contrastive training with in-batch and hard negatives</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Each row is a classification: pick the query's own document out of all columns.</text><text x="142.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">d1</text><text x="186.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">d2</text><text x="230.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">d3</text><text x="274.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">d4</text><text x="328.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">h1</text><text x="372.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">h2</text><text x="416.0" y="110.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">h3</text><text x="208.0" y="88.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="middle">batch documents</text><text x="372.0" y="88.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#9a6700" class="d-t-warn" text-anchor="middle">hard negatives</text><text x="110.0" y="146.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">q1</text><rect x="122.0" y="122.0" width="40.0" height="40.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="142.0" y="146.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">+</text><rect x="166.0" y="122.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="210.0" y="122.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="254.0" y="122.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="308.0" y="122.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="352.0" y="122.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="396.0" y="122.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="110.0" y="190.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">q2</text><rect x="122.0" y="166.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="166.0" y="166.0" width="40.0" height="40.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="186.0" y="190.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">+</text><rect x="210.0" y="166.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="254.0" y="166.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="308.0" y="166.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="352.0" y="166.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="396.0" y="166.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="110.0" y="234.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">q3</text><rect x="122.0" y="210.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="166.0" y="210.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="210.0" y="210.0" width="40.0" height="40.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="230.0" y="234.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">+</text><rect x="254.0" y="210.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="308.0" y="210.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="352.0" y="210.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="396.0" y="210.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="110.0" y="278.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">q4</text><rect x="122.0" y="254.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="166.0" y="254.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="210.0" y="254.0" width="40.0" height="40.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><rect x="254.0" y="254.0" width="40.0" height="40.0" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="274.0" y="278.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">+</text><rect x="308.0" y="254.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="352.0" y="254.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="396.0" y="254.0" width="40.0" height="40.0" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><rect x="470.0" y="100.0" width="386.0" height="60.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="663.0" y="128.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">logits = q · d / τ</text><text x="663.0" y="146.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">unit vectors: cosine in [−1, 1]; τ = 0.05 (×20)</text><rect x="470.0" y="172.0" width="386.0" height="60.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" class="d-default"/><text x="663.0" y="200.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">loss = cross-entropy, target = diagonal</text><text x="663.0" y="218.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">B rows, B + H columns: every other row's positive is free</text><rect x="470.0" y="244.0" width="386.0" height="60.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="663.0" y="272.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">hard negatives: BM25 near-misses</text><text x="663.0" y="290.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">skip the top ranks: unlabelled positives (false negatives)</text><rect x="24.0" y="320.0" width="18.0" height="14.0" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="50.0" y="332.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">positive</text><rect x="130.0" y="320.0" width="18.0" height="14.0" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="5 4" class="d-muted"/><text x="156.0" y="332.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">in-batch negative</text><rect x="290.0" y="320.0" width="18.0" height="14.0" rx="3" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="316.0" y="332.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">hard negative</text><rect x="24.0" y="360.0" width="832.0" height="40.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="440.0" y="385.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">Bigger batches = more negatives for free; harder negatives = more signal per row.</text></svg>

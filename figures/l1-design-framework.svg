<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img"><desc>Nine steps of an ML system design answer: clarify, metrics, data, features, model, serving, evaluation, monitoring and risks.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="320" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">ML system design in nine steps</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Same order every time; about 35-45 minutes.</text><rect x="30.0" y="80.0" width="148.0" height="60.0" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" class="d-good"/><text x="104.0" y="108.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">1 Clarify</text><text x="104.0" y="126.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">goal, users, scale</text><line x1="180.0" y1="110.0" x2="192.0" y2="110.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="196.0" y="80.0" width="148.0" height="60.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="270.0" y="101.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">2 Metrics</text><text x="270.0" y="119.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">offline, online,</text><text x="270.0" y="133.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">guard</text><line x1="346.0" y1="110.0" x2="358.0" y2="110.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="362.0" y="80.0" width="148.0" height="60.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="436.0" y="108.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">3 Data</text><text x="436.0" y="126.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">labels and delay</text><line x1="512.0" y1="110.0" x2="524.0" y2="110.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="528.0" y="80.0" width="148.0" height="60.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="602.0" y="108.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">4 Features</text><text x="602.0" y="126.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">point-in-time</text><line x1="678.0" y1="110.0" x2="690.0" y2="110.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="694.0" y="80.0" width="148.0" height="60.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="768.0" y="108.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">5 Model</text><text x="768.0" y="126.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">baseline first</text><rect x="30.0" y="190.0" width="148.0" height="60.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="104.0" y="218.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">6 Serving</text><text x="104.0" y="236.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">batch or online</text><line x1="180.0" y1="220.0" x2="192.0" y2="220.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="196.0" y="190.0" width="148.0" height="60.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="270.0" y="218.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">7 Evaluate</text><text x="270.0" y="236.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">time split, A/B</text><line x1="346.0" y1="220.0" x2="358.0" y2="220.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="362.0" y="190.0" width="148.0" height="60.0" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6" class="d-accent"/><text x="436.0" y="218.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">8 Monitor</text><text x="436.0" y="236.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">drift, rollback</text><line x1="512.0" y1="220.0" x2="524.0" y2="220.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><rect x="528.0" y="190.0" width="148.0" height="60.0" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" class="d-warn"/><text x="602.0" y="218.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="600" fill="#1f2328" class="d-fg" text-anchor="middle">9 Risks</text><text x="602.0" y="236.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="middle">loops, fairness</text><path d="M 778 142 L 778 162 L 104 162 L 104 186" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><text x="30.0" y="300.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Start from the decision the model supports, state assumptions with numbers, and name the trade-off every time you choose.</text></svg>

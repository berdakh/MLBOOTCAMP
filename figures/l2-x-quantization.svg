<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img"><desc>A float number line from -1.2 to 2.3 maps onto the int8 line from -128 to 127. Zero maps exactly to the zero-point -41 and 1.0 maps to 32. The scale is 3.5/255.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de" class="d-head"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" class="d-head-a"/></marker></defs><rect width="880" height="380" fill="#ffffff" class="d-bg"/><text x="24.0" y="30.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="700" fill="#1f2328" class="d-fg" text-anchor="start">Affine int8 quantisation: a scale and a zero-point</text><text x="24.0" y="49.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">Map the float range [min, max] onto the 256 integers [−128, 127].</text><line x1="100.0" y1="120.0" x2="780.0" y2="120.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><line x1="100.0" y1="220.0" x2="780.0" y2="220.0" stroke="#d0d7de" stroke-width="1.8" class="d-edge"/><text x="88.0" y="124.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">float</text><text x="88.0" y="224.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="end">int8</text><line x1="100.0" y1="114" x2="100.0" y2="126" stroke="#1f2328" stroke-width="1.6"/><line x1="100.0" y1="214" x2="100.0" y2="226" stroke="#1f2328" stroke-width="1.6"/><line x1="100.0" y1="130.0" x2="100.0" y2="208.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><text x="100.0" y="104.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">−1.2 (min)</text><text x="100.0" y="246.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">−128</text><line x1="333.1" y1="114" x2="333.1" y2="126" stroke="#1f2328" stroke-width="1.6"/><line x1="333.1" y1="214" x2="333.1" y2="226" stroke="#1f2328" stroke-width="1.6"/><line x1="333.1" y1="130.0" x2="333.1" y2="208.0" stroke="#0969da" stroke-width="2" fill="none" class="d-edge-a" marker-end="url(#ah-a)"/><text x="333.1" y="104.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">0.0</text><text x="333.1" y="246.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="middle">−41 = z</text><line x1="527.4" y1="114" x2="527.4" y2="126" stroke="#1f2328" stroke-width="1.6"/><line x1="527.4" y1="214" x2="527.4" y2="226" stroke="#1f2328" stroke-width="1.6"/><line x1="527.4" y1="130.0" x2="527.4" y2="208.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><text x="527.4" y="104.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">1.0</text><text x="527.4" y="246.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">32</text><line x1="780.0" y1="114" x2="780.0" y2="126" stroke="#1f2328" stroke-width="1.6"/><line x1="780.0" y1="214" x2="780.0" y2="226" stroke="#1f2328" stroke-width="1.6"/><line x1="780.0" y1="130.0" x2="780.0" y2="208.0" stroke="#d0d7de" stroke-width="1.8" fill="none" class="d-edge" marker-end="url(#ah)"/><text x="780.0" y="104.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">2.3 (max)</text><text x="780.0" y="246.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="middle">127</text><text x="24.0" y="290.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">scale</text><text x="120.0" y="290.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="start">s = (max − min) / 255 = 3.5 / 255 ≈ 0.0137</text><text x="560.0" y="290.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="start"></text><text x="24.0" y="310.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">zero-point</text><text x="120.0" y="310.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="start">z = round(−128 − min / s) = −41</text><text x="560.0" y="310.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="start">0.0 is stored exactly</text><text x="24.0" y="330.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">quantise</text><text x="120.0" y="330.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="start">q = clip(round(x / s) + z, −128, 127)</text><text x="560.0" y="330.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="start">1.0 → 73 − 41 = 32</text><text x="24.0" y="350.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="400" fill="#656d76" class="d-muted_fg" text-anchor="start">dequantise</text><text x="120.0" y="350.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#1f2328" class="d-fg" text-anchor="start">x̂ = s · (q − z)</text><text x="560.0" y="350.0" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#0969da" class="d-t-accent" text-anchor="start">32 → 0.0137 × 73 = 1.002</text></svg>
